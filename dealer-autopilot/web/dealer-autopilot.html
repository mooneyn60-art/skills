<style>
/* Layout: a sticky top bar with tabs; one working column of cards; the Today view splits into Call / Send columns on wide screens. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #14202b; --muted: #5d6b78; --line: #d8dee5;
  --accent: #0d5f7d; --accent-ink: #ffffff; --accent-soft: #e2f0f5;
  --good: #11764f; --warn: #a35f00; --bad: #b3261e; --warn-soft: #fff4e0;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --panel: #172029; --ink: #e6edf3; --muted: #9aa8b5; --line: #2a3640;
  --accent: #4fb3d6; --accent-ink: #062330; --accent-soft: #15313d;
  --good: #46c08d; --warn: #f0a640; --bad: #f2867d; --warn-soft: #3a2c12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151b; --panel: #172029; --ink: #e6edf3; --muted: #9aa8b5; --line: #2a3640;
  --accent: #4fb3d6; --accent-ink: #062330; --accent-soft: #15313d;
  --good: #46c08d; --warn: #f0a640; --bad: #f2867d; --warn-soft: #3a2c12; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em }
h2 { font-size: 17px; font-weight: 700 }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700 }
.muted { color: var(--muted) } .small { font-size: 13px }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: .02em }
a { color: var(--accent) }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0 }
textarea { resize: vertical }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted) }
.btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--accent) }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad) }
.btn.sm { padding: 5px 10px; font-size: 13px }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.spread { justify-content: space-between }
.stack { display: grid; gap: 12px }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start }
.grid2 > * { min-width: 0 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top-inner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 1200px; margin: 0 auto }
.brand { font: 800 17px var(--f-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px }
.brand .plate { font: 500 11px var(--f-mono); border: 1.5px solid var(--ink); border-radius: 4px; padding: 1px 5px; letter-spacing: .08em }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; order: 3; flex-basis: 100%; scrollbar-width: none }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 10px; border-radius: 8px; font-weight: 600; font-size: 14px; white-space: nowrap }
nav.tabs a.on { color: var(--ink); background: var(--bg) }
nav.tabs a .ct { font: 500 11px var(--f-mono); margin-left: 4px; color: var(--accent) }
@media (min-width: 900px) { nav.tabs { order: 0; flex-basis: auto } }
.ask { margin-left: auto }
main { max-width: 1200px; margin: 0 auto; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.note { background: var(--warn-soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px }

.pill { display: inline-block; font: 600 11.5px var(--f-body); padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.p-follow { color: var(--accent) } .p-sold { color: var(--good) } .p-out { color: #7b4fc2 } .p-dnc { color: var(--bad) }
.p-active { color: var(--good) } .p-replied { color: var(--warn) } .p-paused, .p-done { color: var(--muted) }
.stock { font: 500 12.5px var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap }

.item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px }
.item.hot { border-left: 4px solid var(--warn) }
.item .who { font-weight: 700; cursor: pointer }
.item .src { font-size: 12.5px; color: var(--muted) }
.item textarea { min-height: 84px }
.flag { color: var(--bad); font-size: 13px } .ok { color: var(--good); font-size: 13px }
.count { font: 500 12px var(--f-mono); color: var(--muted); margin-left: 6px }
.empty { text-align: center; color: var(--muted); padding: 22px 12px }
.chipbar { display: flex; gap: 6px; flex-wrap: wrap }
.chipbar button { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer }
.chipbar button.on { background: var(--ink); color: var(--panel); border-color: var(--ink) }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 700 11.5px var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
tr.click { cursor: pointer } tr.click:hover td { background: var(--bg) }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums }

.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 20, .45); display: flex; justify-content: flex-end }
.sheet-card { background: var(--panel); width: min(560px, 100%); height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); border-left: 1px solid var(--line) }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel) }
.sheet-body { padding: 16px; display: grid; gap: 16px }
.x { border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 5px 10px; font-size: 14px }
.kv > :nth-child(odd) { color: var(--muted) }
.thread { display: grid; gap: 6px }
.bub { max-width: 90%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px }
.bub.out { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px }
.bub.in { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 3px }
.bub.call { justify-self: center; background: transparent; color: var(--muted); font-size: 13px }
.bub .meta { font-size: 11px; opacity: .8; margin-top: 3px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px; z-index: 40; font-weight: 600; max-width: calc(100% - 32px) }
.stat { display: grid; gap: 2px } .stat b { font: 800 30px var(--f-display); font-variant-numeric: tabular-nums } .stat span { font-size: 13px; color: var(--muted) }
.tars-log { display: grid; gap: 10px; padding: 16px; flex: 1; align-content: start }
.msg { padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px }
.msg.u { justify-self: end; background: var(--accent); color: var(--accent-ink); max-width: 90% }
.msg.b { justify-self: start; background: var(--bg); border: 1px solid var(--line); max-width: 95% }
.msg .acts { color: var(--good); font-size: 12.5px; margin-top: 6px }
.tars-form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel) }
@media (prefers-reduced-motion: no-preference) { .item, .card { transition: border-color .15s } }
</style>

<header class="top"><div class="top-inner">
  <div class="brand"><span class="plate">DA</span> Dealer Autopilot</div>
  <nav class="tabs" id="tabs">
    <a href="#today" data-v="today">Today <span class="ct" id="ctToday"></span></a>
    <a href="#customers" data-v="customers">Customers</a>
    <a href="#calendar" data-v="calendar">Calendar</a>
    <a href="#stock" data-v="stock">Stock #s</a>
    <a href="#grow" data-v="grow">Grow</a>
    <a href="#score" data-v="score">Scoreboard</a>
    <a href="#templates" data-v="templates">Templates</a>
    <a href="#import" data-v="import">Import</a>
    <a href="#setup" data-v="setup">Setup</a>

</div></header>
<main id="view"><div class="card empty">Loading your customers…</div></main>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

  loaded: { customers: false, appts: false, inv: false }, offline: false, auto: null, view: 'today', filter: { group: 'follow', stage: '', q: '' }, tars: [] };

/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const nowIso = () => new Date().toISOString();
const todayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtWhen = (iso) => iso ? new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const fmtDay = (iso) => iso ? new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const fmtClock = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const nm = (c) => `${c.first_name || ''} ${c.last_name || ''}`.trim() || c.phone || c.email || 'Customer';
const normPhone = (p) => { const r = String(p || '').trim(); const d = r.replace(/\D/g, ''); if (!d) return ''; if (r.startsWith('+')) return '+' + d; if (d.length === 10) return '+1' + d; if (d.length === 11 && d[0] === '1') return '+' + d; return '+' + d; };
const fmtPhone = (p) => { const d = String(p || '').replace(/\D/g, ''); return d.length === 11 && d[0] === '1' ? `(${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}` : (p || ''); };
const normStock = (s) => String(s || '').trim().toUpperCase();
const splitStocks = (s) => (Array.isArray(s) ? s : String(s || '').split(/[,;|/\s]+/)).map(normStock).filter(Boolean);
const bool = (v) => v === true || /^(1|y|yes|true|x|opt.?in|opted in)$/i.test(String(v ?? '').trim());
function parseDate(v) {
  if (!v) return ''; const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/);
  if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  const d = new Date(s); return isNaN(d) ? '' : todayKey(d);
}
function parseBirthday(v) {
  if (!v) return ''; const s = String(v).trim(); let m = s.match(/^\d{4}-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}`;
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})/); return m ? `${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` : '';
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }

  toast('Select the text and copy it'); return Promise.resolve();
}
const stagePill = (st) => `<span class="pill p-${STAGES[st]?.group || 'follow'}">${esc(STAGES[st]?.label || st)}</span>`;
const statusPill = (s) => `<span class="pill p-${esc(s)}">${esc(s === 'done' ? 'finished' : s)}</span>`;
const vehicleOf = (c) => {
  const st = (c.stocks || [])[0]; const v = st && S.inv.get(st);
  return { stock: st || '', label: (v && [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ')) || c.vehicle || '' };
};
const vName = (v) => [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ');

/* render a template: {placeholders}; [[ ... ]] dropped when a placeholder inside it is empty */
function render(tpl, c, extra = {}) {
  const s = S.settings; const v = vehicleOf(c);
  const vars = { first_name: c.first_name || 'there', last_name: c.last_name || '', vehicle: v.label || (v.stock ? `vehicle (stock #${v.stock})` : 'vehicle'), _veh: v.label,
    stock: v.stock, objection: c.objection || '', salesperson: s.salesperson || '[your name]', dealership: s.dealership || 'the dealership',
    dealer_phone: s.dealer_phone || '', dealer_address: s.dealer_address || '[dealership address]', review_link: s.review_link || '[review link]', ...extra };
  const fill = (x) => x.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  const out = String(tpl || '').replace(/\[\[([\s\S]*?)\]\]/g, (m, inner) => {
    const empty = [...inner.matchAll(/\{(\w+)\}/g)].some((x) => !(x[1] === 'vehicle' ? vars._veh : vars[x[1]]));
    return empty ? '' : fill(inner);
  });
  return fill(out).replace(/[ \t]{2,}/g, ' ').replace(/ +([.,!?])/g, '$1').trim();
}

/* compliance gate: null = allowed, else the reason */
function blockReason(c, ch) {
  if (c.stage === 'dnc') return 'Do not contact';
  if (ch === 'sms' || ch === 'call') {
    if (!c.phone) return 'No phone number';
    if (c.dnc_registry && !c.initiated) return 'On the Do Not Call registry and did not contact you first';
  }
  if (ch === 'sms' && !c.consent) return 'No recorded consent to text';
  if (ch === 'email') { if (!c.email) return 'No email address'; if (c.email_opt_out) return 'Unsubscribed from email'; if (!c.consent && !c.email_ok) return 'No recorded consent'; }
  return null;
}
function inTextWindow(d = new Date()) { const h = d.getHours(); return h >= Math.max(8, +S.settings.text_start || 8) && h < Math.min(21, +S.settings.text_end || 21); }
const cadence = (stage) => S.tpl.cadence?.[stage] || DEFAULT_TEMPLATES.cadence[stage] || [];
const apptTpl = (k) => S.tpl.appt?.[k] ?? DEFAULT_TEMPLATES.appt[k];

/* ============ storage (db capability) ============ */
const writing = new Map();
function saveDoc(col, id, data) {
  if (!S.db) { toast('Not connected: changes can\'t be saved right now'); return Promise.resolve(); }
  const key = col + '/' + id;
  const prev = writing.get(key) || Promise.resolve();
  const next = prev.then(() => S.db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data)))).catch((e) => toast(e?.code === 'quota_exceeded' ? 'Storage is full. Delete old customers to make room.' : 'Could not save: ' + (e?.message || 'try again')));
  writing.set(key, next); return next;
}
function delDoc(col, id) { return S.db ? S.db.collection(col).doc(id).delete().catch(() => toast('Could not delete')) : Promise.resolve(); }
function saveCustomer(c) { c.updated_at = nowIso(); S.customers.set(c.id, c); scheduleRender(); return saveDoc('customers', c.id, c); }
function saveAppt(a) { S.appts.set(a.id, a); scheduleRender(); return saveDoc('appointments', a.id, a); }
function saveVehicleDoc(v) { S.inv.set(v.stock_number, v); scheduleRender(); return saveDoc('inventory', v.stock_number, v); }
function saveSettings() { scheduleRender(); return saveDoc('config', 'settings', S.settings); }
function saveTemplates() { scheduleRender(); return saveDoc('config', 'templates', S.tpl); }
const newId = () => (S.db ? S.db.collection('customers').doc().id : 'local' + Math.random().toString(36).slice(2));
function logHist(c, dir, ch, body, extra = {}) {
  c.history = [...(c.history || []), { at: nowIso(), dir, ch, body: String(body).slice(0, 1500), ...extra }].slice(-60);
  if (dir === 'out') { c.last_contact_at = nowIso(); c.first_contact_at = c.first_contact_at || nowIso(); }
}

/* ============ customer lifecycle ============ */
function startPoint(stage, enteredIso) {
  const steps = cadence(stage); const cutoff = Date.now() - 3 * DAY; let i = 0;
  while (i < steps.length && new Date(enteredIso).getTime() + steps[i].day * DAY < cutoff) i++;
  return i;
}
function findExisting(phone, email) {
  for (const c of S.customers.values()) { if ((phone && c.phone === phone) || (email && c.email === email)) return c; }
  return null;
}
function resolveReferrer(text, selfId) {
  const r = String(text || '').trim(); if (!r) return null; const d = r.replace(/\D/g, '');
  for (const c of S.customers.values()) {
    if (c.id === selfId) continue;
    if (d.length >= 7 && c.phone && c.phone.endsWith(d.slice(-10))) return c.id;
  }
  const hits = [...S.customers.values()].filter((c) => c.id !== selfId && nm(c).toLowerCase() === r.toLowerCase());
  return hits.length === 1 ? hits[0].id : null;
}
/** Create or merge a customer. Returns {c, created}. Does not save; caller saves. */
function upsert(data) {
  const phone = normPhone(data.phone); const email = String(data.email || '').trim().toLowerCase();
  const stage = STAGES[data.stage] ? data.stage : 'new_lead';
  const stocks = splitStocks(data.stocks ?? data.stock_numbers);
  const ex = findExisting(phone, email);
  if (ex) {
    for (const k of ['first_name', 'last_name', 'vehicle', 'objection', 'source']) if (data[k]) ex[k] = data[k];
    if (phone) ex.phone = phone; if (email) ex.email = email;
    if (data.notes && !String(ex.notes || '').includes(data.notes)) ex.notes = [ex.notes, data.notes].filter(Boolean).join('\n');
    ex.stocks = [...new Set([...(ex.stocks || []), ...stocks])];
    if (bool(data.consent) && !ex.consent && ex.stage !== 'dnc') Object.assign(ex, { consent: true, consent_source: data.consent_source || 'Import', consent_date: nowIso() });
    if (bool(data.dnc_registry)) ex.dnc_registry = true;
    if (data.do_not_contact && bool(data.do_not_contact)) setStage(ex, 'dnc');
    else if (data.stage && data.stage !== ex.stage && ex.stage !== 'dnc') setStage(ex, stage);
    return { c: ex, created: false };
  }
  const now = nowIso(); const dnc = data.do_not_contact && bool(data.do_not_contact);
  const sold = parseDate(data.sold_date); const leadD = parseDate(data.lead_at);
  let entered = now;
  if (stage === 'sold' && sold && sold < todayKey()) entered = new Date(sold + 'T15:00:00').toISOString();
  if (['new_lead', 'phone_up', 'be_back'].includes(stage) && leadD && leadD < todayKey()) entered = new Date(leadD + 'T12:00:00').toISOString();
  const c = {
    id: newId(), first_name: String(data.first_name || '').trim(), last_name: String(data.last_name || '').trim(), phone: phone || '', email: email || '',
    stage: dnc ? 'dnc' : stage, status: dnc ? 'done' : 'active', vehicle: data.vehicle || '', objection: data.objection || '', notes: data.notes || '',
    source: data.source || '', stocks, consent: !dnc && bool(data.consent), consent_source: !dnc && bool(data.consent) ? (data.consent_source || 'Recorded on entry') : '',
    consent_date: !dnc && bool(data.consent) ? now : '', dnc_registry: bool(data.dnc_registry), initiated: data.initiated === undefined ? stage !== 'lost' : bool(data.initiated),
    email_opt_out: !!dnc, step: entered !== now ? startPoint(stage, entered) : 0, stage_at: entered,
    lead_at: ['new_lead', 'phone_up', 'be_back'].includes(stage) ? (entered !== now ? entered : now) : '', sold_date: stage === 'sold' ? (sold || todayKey()) : '',
    birthday: parseBirthday(data.birthday), referred_by: String(data.referred_by || ''), referred_by_id: null, history: [], created_at: now, updated_at: now,
    example: !!data.example,

}
function setStage(c, stage) {
  const old = c.stage; c.prev_stage = old; c.stage = stage; c.step = 0; c.stage_at = nowIso();
  c.status = stage === 'dnc' ? 'done' : 'active';
  delete c.campaign; delete c.draft;
  if (stage === 'sold') {
    c.sold_date = todayKey();
    const ref = c.referred_by_id && S.customers.get(c.referred_by_id);
    if (ref && ref.stage !== 'dnc' && old !== 'sold') { ref.ref_thanks = { name: nm(c) }; saveCustomer(ref); }
  }
  if (stage === 'dnc') { c.consent = false; c.email_opt_out = true; delete c.match; delete c.ref_thanks; }
}
function resume(c) {
  const steps = cadence(c.stage); const el = (Date.now() - new Date(c.stage_at).getTime()) / DAY;
  let i = c.step || 0; while (i < steps.length - 1 && steps[i + 1].day <= el) i++;
  c.step = i; c.status = 'active';
}

/* ============ the daily list (derived from your data) ============ */
function buildList() {
  const calls = [], send = [], auto = []; const now = Date.now(); const mmdd = todayKey().slice(5); const yr = new Date().getFullYear();
  const msg = (c, src, ch, body, extra = {}) => {
    const blocked = blockReason(c, ch);
    if (!blocked) send.push({ c, src, ch, body, ...extra });
    else if (blocked.startsWith('No recorded consent') && !blockReason(c, 'call')) calls.push({ c, src: 'consent', from: src, ch, title: `Ask ${nm(c)} if it's OK to text and email them. A ${ch === 'sms' ? 'text' : 'email'} is waiting.`, ...extra });
    else send.push({ c, src, ch, body, blocked, ...extra });
  };
  for (const c of S.customers.values()) {
    if (c.stage === 'dnc') continue;
    if (c.status === 'replied') calls.push({ c, src: 'reply', title: `${nm(c)} replied${c.reply_text ? `: "${c.reply_text}"` : ''}. Get back to them now.` });
    if (c.draft) send.push({ c, src: 'draft', ch: c.draft.ch, body: c.draft.body, subject: c.draft.subject });
    if (c.match) msg(c, 'match', 'sms', render(extraTpl(c.match.kind === 'sold' ? 'stock_sold' : 'new_arrival'), c, { match_vehicle: c.match.vehicle, match_stock: c.match.stock }));
    if (c.ref_thanks) msg(c, 'referral', 'sms', render(extraTpl('referral_thanks'), c, { referral_name: c.ref_thanks.name }));
    if (c.campaign && new Date(c.campaign.due).getTime() <= now) {
      if (!blockReason(c, 'sms')) send.push({ c, src: 'campaign', ch: 'sms', body: render(extraTpl(c.campaign.key), c) });
      else if (!blockReason(c, 'call')) calls.push({ c, src: 'campaign', title: c.campaign.key === 'equity' ? `Call ${nm(c)}: bought ${c.sold_date}. Their car may be worth more than they owe.` : `Call ${nm(c)}: old lead. Still in the market?` });
    }
    if (c.birthday === mmdd && c.bday_year !== yr && !blockReason(c, 'sms')) send.push({ c, src: 'birthday', ch: 'sms', body: render(extraTpl('birthday'), c) });
    if (c.status === 'active') {
      const step = cadence(c.stage)[c.step || 0];
      if (step && new Date(c.stage_at).getTime() + step.day * DAY <= now) {
        if (step.ch === 'call') { if (!blockReason(c, 'call')) calls.push({ c, src: 'sequence', title: render(step.body, c) }); else send.push({ c, src: 'sequence', ch: 'call', body: render(step.body, c), blocked: blockReason(c, 'call') }); }
        else if (step.ch === 'email' && S.settings.auto_email && !blockReason(c, 'email') && !/\[[^\]]+\]/.test(step.body + (step.subject || '')))
          auto.push({ c, src: 'sequence', ch: 'email', subject: step.subject ? render(step.subject, c) : '', body: render(step.body, c) });
        else msg(c, 'sequence', step.ch, render(step.body, c), { subject: step.subject ? render(step.subject, c) : '' });
      }
    }
  }
  for (const a of S.appts.values()) {
    const c = S.customers.get(a.customer_id); if (!c || c.stage === 'dnc' || !['scheduled', 'confirmed'].includes(a.status)) continue;
    const t = new Date(a.at).getTime(); const ex = { appt_type: (APPT_TYPES[a.type] || 'visit').toLowerCase(), appt_time: fmtWhen(a.at), appt_clock: fmtClock(a.at) };
    if (!a.confirm_done && t > now) msg(c, 'appt', 'sms', render(apptTpl('confirm'), c, ex), { appt: a, flag: 'confirm_done' });
    else if (!a.rem_day_done && t > now && todayKey(new Date(t)) === todayKey(new Date(now + DAY))) msg(c, 'appt', 'sms', render(apptTpl('reminder_day'), c, ex), { appt: a, flag: 'rem_day_done' });
    else if (!a.rem_2h_done && t > now && t - now <= 2 * 3600000) msg(c, 'appt', 'sms', render(apptTpl('reminder_2h'), c, ex), { appt: a, flag: 'rem_2h_done' });
    if (now >= t + 30 * 60000) calls.unshift({ c, src: 'outcome', appt: a, title: `Did ${nm(c)} show for the ${ex.appt_type} at ${fmtClock(a.at)} ${todayKey(new Date(t)) === todayKey() ? 'today' : 'on ' + fmtDay(a.at)}?` });
  }
  for (const a of S.appts.values()) {
    const c = S.customers.get(a.customer_id);
    if (c && a.status === 'no_show' && !a.noshow_done && c.stage !== 'dnc') msg(c, 'noshow', 'sms', render(apptTpl('no_show'), c), { appt: a, flag: 'noshow_done' });
  }
  const order = { reply: 0, outcome: 1, consent: 3, sequence: 4, campaign: 5 };
  calls.sort((a, b) => (order[a.src] ?? 2) - (order[b.src] ?? 2));
  return { calls, send, auto };
}
const SRC = { sequence: 'Follow-up schedule', reply: 'Customer replied', consent: 'Needs permission', outcome: 'Appointment check', appt: 'Appointment', noshow: 'No-show',
  draft: 'Your draft', match: 'Inventory match', campaign: 'Campaign', birthday: 'Birthday', referral: 'Referral thank-you' };

/* actions on list items */
function finishItem(it, sent, body) {
  const c = it.c;
  if (sent) logHist(c, 'out', it.ch === 'call' ? 'call' : it.ch, body ?? it.body);
  switch (it.src) {
    case 'sequence': c.step = (c.step || 0) + 1; if (c.step >= cadence(c.stage).length && c.stage !== 'appointment') c.status = 'done'; break;
    case 'draft': delete c.draft; break;
    case 'match': delete c.match; break;
    case 'referral': delete c.ref_thanks; break;
    case 'campaign': delete c.campaign; break;
    case 'birthday': c.bday_year = new Date().getFullYear(); break;
    case 'reply': c.status = 'paused'; delete c.reply_text; break;
    case 'appt': case 'noshow': { const a = { ...it.appt, [it.flag]: true }; saveAppt(a); break; }
  }
  return saveCustomer(c);
}

/* ============ rendering ============ */

const VIEWS = {};

function renderView() {

  const focus = document.activeElement; const fid = focus && focus.id; const sel = fid && focus.selectionStart;
  if (fid && ['INPUT', 'TEXTAREA'].includes(focus.tagName) && focus.closest('#view') && focus.dataset.keep !== undefined) return; // don't clobber typing
  $('#view').innerHTML = VIEWS[S.view](L);
  if (fid) { const el = document.getElementById(fid); if (el && el.closest('#view')) { el.focus(); try { el.setSelectionRange(sel, sel); } catch {} } }
  bindView(L);

function goalsBar() {
  const now = new Date(); const monthStart = todayKey(new Date(now.getFullYear(), now.getMonth(), 1));
  const weekStart = new Date(now); weekStart.setHours(0, 0, 0, 0); weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
  const cs = [...S.customers.values()].filter((c) => !c.example);
  const sold = cs.filter((c) => c.sold_date && c.sold_date >= monthStart).length;
  const goal = Math.max(1, +S.settings.monthly_goal || 12);
  const dayOfMonth = now.getDate(); const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const pace = Math.round((sold / dayOfMonth) * daysInMonth);
  const today = todayKey();
  let calls = 0, sent = 0;
  for (const c of cs) for (const h of c.history || []) {
    if (h.dir === 'out' && todayKey(new Date(h.at)) === today) { if (h.ch === 'call') calls++; else if (!h.auto) sent++; }
  }
  const appts = [...S.appts.values()].filter((a) => a.created_at && new Date(a.created_at) >= weekStart).length;
  const target = +S.settings.call_target || 5;
  const cell = (big, small, ok) => `<div class="stat"><b style="${ok === undefined ? '' : `color:var(--${ok ? 'good' : 'warn'})`}">${big}</b><span>${small}</span></div>`;
  return `<div class="card" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    ${cell(`${sold}<small style="font-size:16px;color:var(--muted)">/${goal}</small>`, `Sold this month · on pace for ${pace}`, pace >= goal)}
    ${cell(`${calls}<small style="font-size:16px;color:var(--muted)">/${target}</small>`, 'Calls today', calls >= target)}
    ${cell(sent, 'Texts and emails you sent today')}
    ${cell(appts, 'Appointments set this week')}</div>`;
}
function autoStatus() {

  if (!a || !a.last_run) return '<div class="note">Automatic email is on. The first run happens within the hour (9 am to 7 pm).</div>';
  const mins = Math.round((Date.now() - new Date(a.last_run).getTime()) / 60000);

}
const loadingNote = () => (!S.loaded.customers ? `<div class="note">${S.offline ? 'Can\'t reach your saved data right now. What you see may be out of date.' : 'Loading your customers…'}</div>` : '');

};

VIEWS.today = (L) => {
  const n = S.customers.size;
  const intro = n ? '' : `<div class="card stack"><h2>Start here</h2><p class="muted">Add your customers and this page builds your list every day: who to call, and texts and emails ready to send in your voice.</p>

function campaignAudience(key) {

function weekStats(from, to) {
  const inR = (iso) => iso && iso >= from && iso < to;
  const cs = [...S.customers.values()];
  const leads = cs.filter((c) => inR(c.lead_at));
  const resp = leads.filter((c) => c.first_contact_at).map((c) => (new Date(c.first_contact_at) - new Date(c.lead_at)) / 60000).filter((m) => m >= 0).sort((a, b) => a - b);
  const med = resp.length ? (resp.length % 2 ? resp[(resp.length - 1) / 2] : (resp[resp.length / 2 - 1] + resp[resp.length / 2]) / 2) : null;
  const ap = [...S.appts.values()]; const set = ap.filter((a) => inR(a.created_at)).length;
  const held = ap.filter((a) => inR(a.at) && ['showed', 'no_show'].includes(a.status)); const shows = held.filter((a) => a.status === 'showed').length;
  const sold = cs.filter((c) => c.sold_date && c.sold_date >= from.slice(0, 10) && c.sold_date < to.slice(0, 10)).length;
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
  return { from, leads: leads.length, med: med === null ? null : Math.round(med * 10) / 10, under5: pct(resp.filter((m) => m <= 5).length, leads.length), notc: leads.filter((c) => !c.first_contact_at).length,
    set, apptRate: pct(set, leads.length), shows, noShows: held.length - shows, showRate: pct(shows, held.length), sold, closeRate: pct(sold, shows) };
}

/* ============ binding ============ */
function findItem(L, key) { return [...L.calls, ...L.send].find((it) => itemKey(it) === key); }
function bindView(L) {
  const v = $('#view');
  v.onclick = async (e) => {
    const t = e.target.closest('button, [data-open], [data-stock], [data-appt], a[data-open-app]'); if (!t) return;
    const d = t.dataset;
    if (d.open && !t.matches('button.btn') || (t.matches('button') && d.open)) return openCustomer(d.open);
    if (d.stock) return openVehicle(d.stock);
    if (d.appt) return openAppt(S.appts.get(d.appt));
    if (d.copy) return copy(d.copy);
    if (d.copymsg) { const b = $('#' + d.copymsg)?.value || ''; const sj = $('#' + d.subj)?.value; return copy(d.ch === 'email' && sj ? `Subject: ${sj}\n\n${b}` : b); }
    if (d.sent) { const it = findItem(L, d.sent); if (!it) return; const b = $('#' + d.body)?.value ?? it.body; if (/\[[^\]]+\]/.test(b)) return toast('Fill in the [bracketed] parts first'); await finishItem(it, true, b); return toast('Logged as sent'); }
    if (d.skip) { const it = findItem(L, d.skip); if (it) { await finishItem(it, false); toast('Skipped'); } return; }
    if (d.called) { const it = findItem(L, d.called); if (!it) return; const note = $('#' + d.note)?.value; logHist(it.c, 'out', 'call', note ? 'Call: ' + note : 'Called'); await finishItem(it, false); return toast('Call logged'); }
    if (d.replied) return repliedSheet(S.customers.get(d.replied));
    if (d.apptFor) return openAppt(null, d.apptFor);
    if (d.suggest) return suggestReply(S.customers.get(d.suggest));
    if (d.consent) { const it = findItem(L, d.consent); if (!it) return; Object.assign(it.c, { consent: true, consent_source: 'Said yes when I called', consent_date: nowIso() }); logHist(it.c, 'out', 'call', 'Asked permission to text/email: yes'); await saveCustomer(it.c); return toast('Permission recorded. The message is ready under Send these.'); }
    if (d.out) { const it = findItem(L, d.out === 'sold' || d.out === 'unsold' || d.out === 'no_show' ? t.dataset.k : ''); if (it) return outcome(it, d.out); return; }
    if (d.g) { S.filter.group = d.g; S.filter.stage = ''; return renderView(); }
    if (d.s !== undefined && t.closest('#stages')) { S.filter.stage = d.s; return renderView(); }
    if (d.t) { S.tplTab = d.t; return renderView(); }
    if (d.camp) return runCampaign(d.camp, +($('#per-' + d.camp)?.value || 10));
    if (d.savestep !== undefined) return saveStep(+d.savestep);
    if (d.delstep !== undefined) { const st = S.tplTab || 'new_lead'; const arr = [...cadence(st)]; arr.splice(+d.delstep, 1); S.tpl = { ...S.tpl, cadence: { ...S.tpl.cadence, [st]: arr } }; await saveTemplates(); return toast('Step deleted'); }
    if (d.addstep !== undefined) { const st = S.tplTab || 'new_lead'; const arr = [...cadence(st), T((cadence(st).at(-1)?.day || 0) + 7, 'sms', "Hi {first_name}, it's {salesperson}. ")]; S.tpl = { ...S.tpl, cadence: { ...S.tpl.cadence, [st]: arr } }; await saveTemplates(); return; }
    if (d.savekey) { const val = $('#tk-' + d.savekey).value; S.tpl = { ...S.tpl, [d.set]: { ...(S.tpl[d.set] || {}), [d.savekey]: val } }; await saveTemplates(); return toast('Saved'); }
    if (d.resettpl !== undefined) return confirmSheet('Restore the original templates?', 'Your edits to templates are replaced with the originals.', 'Restore', async () => { S.tpl = DEFAULT_TEMPLATES; await saveTemplates(); toast('Templates restored'); });
    switch (d.act) {
      case 'add': return customerSheet();
      case 'walkin': return walkinSheet();
      case 'appt-new': return openAppt(null);
      case 'vehicle-new': return vehicleSheet({});
      case 'examples': return addExamples();
      case 'clear-examples': return confirmSheet('Remove the example customers?', 'Only the 3 example customers are removed.', 'Remove', async () => { for (const c of [...S.customers.values()].filter((x) => x.example)) { S.customers.delete(c.id); await delDoc('customers', c.id); } for (const a of [...S.appts.values()].filter((a) => !S.customers.has(a.customer_id))) { S.appts.delete(a.id); await delDoc('appointments', a.id); } renderView(); });
      case 'save-settings': { for (const k of Object.keys(DEFAULT_SETTINGS)) { const el = $('#set-' + k); if (el) S.settings[k] = el.type === 'checkbox' ? el.checked : el.value; } S.settings.text_start = Math.max(8, +S.settings.text_start); S.settings.text_end = Math.min(21, +S.settings.text_end); await saveSettings(); return toast('Saved'); }
      case 'imp-preview': return importCustomers(true);
      case 'imp-go': return importCustomers(false);
      case 'inv-go': return importInventory();
    }
  };
  const q = $('#q'); if (q) q.oninput = () => { S.filter.q = q.value; clearTimeout(q.t); q.t = setTimeout(() => { delete q.dataset.keep; renderView(); }, 250); };
  const rf = (inp, ta) => { const i = $(inp); if (i) i.onchange = () => i.files[0]?.text().then((x) => ($(ta).value = x)); };
  rf('#impFile', '#impText'); rf('#invFile', '#invText');
}

/* ============ sheets (side panels) ============ */
function sheet(title, html, onBind) {

  el.innerHTML = `<div class="sheet" id="sheetBg"><div class="sheet-card" role="dialog" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="x" type="button" id="sheetX" aria-label="Close">&times;</button></div><div class="sheet-body">${html}</div></div></div>`;
  const close = () => { el.hidden = true; el.innerHTML = ''; };
  $('#sheetX').onclick = close; $('#sheetBg').onclick = (e) => { if (e.target.id === 'sheetBg') close(); };
  onBind?.(close); return close;
}
function confirmSheet(title, text, label, fn) {

/* 20-second capture right after a customer leaves the floor */

/* matching on new / sold vehicles */
async function saveVehicle(nv, before) {
  await saveVehicleDoc(nv); let n = 0;
  const open = ['new_lead', 'phone_up', 'be_back', 'lost'];
  if (!before && nv.status !== 'sold' && nv.model) {
    const model = nv.model.toLowerCase();
    for (const c of S.customers.values()) {
      if (n >= 15 || !open.includes(c.stage) || c.match || (c.stocks || []).includes(nv.stock_number) || blockReason(c, 'sms')) continue;
      const likes = (c.vehicle || '').toLowerCase().includes(model) || (c.stocks || []).some((s) => (S.inv.get(s)?.model || '').toLowerCase() === model);
      if (likes) { c.match = { kind: 'new', stock: nv.stock_number, vehicle: vName(nv) }; await saveCustomer(c); n++; }
    }
  } else if (before && before.status !== 'sold' && nv.status === 'sold') {
    for (const c of S.customers.values()) {
      if (!open.includes(c.stage) || !(c.stocks || []).includes(nv.stock_number) || blockReason(c, 'sms')) continue;
      c.match = { kind: 'sold', stock: nv.stock_number, vehicle: vName(nv) || `vehicle #${nv.stock_number}` }; await saveCustomer(c); n++;
    }
  }
  return n;
}
async function runCampaign(key, perDay) {
  perDay = Math.max(1, Math.min(50, perDay || 10)); let i = 0;
  for (const c of campaignAudience(key)) {
    if (blockReason(c, 'sms') && blockReason(c, 'call')) continue;
    c.campaign = { key, due: new Date(Date.now() + Math.floor(i / perDay) * DAY).toISOString() }; await saveCustomer(c); i++;
  }
  toast(`${i} customers added to your list over ${Math.ceil(i / perDay) || 0} day(s)`);
}

/* ============ CSV import ============ */
function parseCsv(text) {
  text = String(text || '').replace(/^﻿/, ''); const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { f += '"'; i++; } else if (ch === '"') q = false; else f += ch; }
    else if (ch === '"') q = true; else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += ch; }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim()));
}
const ALIASES = {
  first_name: ['first name', 'first', 'firstname', 'fname', 'customer first name'], last_name: ['last name', 'last', 'lastname', 'lname', 'surname', 'customer last name'],
  full_name: ['name', 'full name', 'customer', 'customer name'], phone: ['phone', 'cell', 'mobile', 'cell phone', 'cellphone', 'phone number', 'mobile phone', 'home phone', 'day phone', 'primary phone'],
  email: ['email', 'e mail', 'email address', 'customer email'], stocks: ['stock', 'stock #', 'stock number', 'stock no', 'stock#', 'stk', 'stk#', 'vehicle stock number', 'sought stock number'],
  vehicle: ['vehicle', 'vehicle of interest', 'interest', 'car', 'model', 'year make model', 'vehicle sought', 'sought vehicle'], objection: ['objection', 'concern', 'held back'],
  notes: ['notes', 'note', 'comments', 'comment'], source: ['source', 'lead source', 'lead provider'], stage: ['stage', 'sales step', 'sales status', 'lead type', 'lead status', 'status', 'type', 'bucket'],
  sold_date: ['sold date', 'date sold', 'delivery date', 'delivered date', 'purchase date'], lead_at: ['lead date', 'created', 'date created', 'created date', 'date received', 'received'],
  consent: ['consent', 'opt in', 'optin', 'sms opt in', 'text opt in', 'ok to text', 'okay to text', 'tcpa consent'], do_not_contact: ['do not contact', 'opted out', 'opt out', 'do not solicit'],
  dnc_registry: ['do not call', 'national dnc', 'dnc', 'dnc registry'], birthday: ['birthday', 'birth date', 'dob', 'date of birth'], referred_by: ['referred by', 'referral'],
};
const key = (s) => String(s || '').trim().toLowerCase().replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ');
function stageFrom(v) { const k = key(v); if (!k) return '';
  if (/(sold|deliver|purchas|won)/.test(k)) return 'sold'; if (/(do not|opt.?out)/.test(k)) return 'dnc'; if (/(lost|dead|bought elsewhere|inactive|orphan|cold)/.test(k)) return 'lost';
  if (/(appointment|appt)/.test(k)) return 'appointment'; if (/(be.?back|showroom|walk.?in|visit|demo|unsold)/.test(k)) return 'be_back'; if (/(phone|call.?in)/.test(k)) return 'phone_up';
  if (/(internet|web|online|lead|new|prospect)/.test(k)) return 'new_lead'; return ''; }
function customersFromCsv(text, defStage) {
  const rows = parseCsv(text); if (rows.length < 2) return { list: [], mapped: {}, skipped: 0 };
  const h = rows[0]; const m = {};
  h.forEach((x, i) => { const k = key(x); for (const [f, names] of Object.entries(ALIASES)) if (m[f] === undefined && (k === f.replace(/_/g, ' ') || names.includes(k))) { m[f] = i; break; } });
  const g = (r, f) => (m[f] !== undefined ? String(r[m[f]] ?? '').trim() : '');
  const list = rows.slice(1).map((r) => { let first = g(r, 'first_name'), last = g(r, 'last_name');
    if (!first && !last && g(r, 'full_name')) { const full = g(r, 'full_name'); if (full.includes(',')) [last, first] = full.split(',').map((s) => s.trim()); else { const p = full.split(/\s+/); first = p.shift(); last = p.join(' '); } }
    return { first_name: first, last_name: last, phone: g(r, 'phone'), email: g(r, 'email'), stocks: g(r, 'stocks'), vehicle: g(r, 'vehicle'), objection: g(r, 'objection'), notes: g(r, 'notes'),
      source: g(r, 'source') || 'Import', stage: stageFrom(g(r, 'stage')) || defStage, sold_date: g(r, 'sold_date'), lead_at: g(r, 'lead_at'),
      consent: m.consent !== undefined ? g(r, 'consent') : undefined, consent_source: 'Opt-in on the imported list', do_not_contact: g(r, 'do_not_contact'), dnc_registry: g(r, 'dnc_registry'),
      birthday: g(r, 'birthday'), referred_by: g(r, 'referred_by') }; }).filter((c) => c.phone || c.email);
  return { list, mapped: Object.fromEntries(Object.entries(m).map(([f, i]) => [f, h[i]])), skipped: rows.length - 1 - list.length };
}

  await saveVehicleDoc({ stock_number: '24518', year: '2024', make: 'Chevrolet', model: 'Tahoe', trim: 'LT', color: 'Black', miles: '12,400', status: 'available', example: true });

  toast('Examples added. Remove them anytime from Today.');
}
function saveStep(i) {
  const st = S.tplTab || 'new_lead'; const arr = cadence(st).map((x) => ({ ...x }));
  arr[i] = { day: Math.max(0, +$('#td-' + i).value || 0), ch: $('#tc-' + i).value, body: $('#tb-' + i).value, subject: $('#ts-' + i)?.value || arr[i].subject || '' };
  arr.sort((a, b) => a.day - b.day); S.tpl = { ...S.tpl, cadence: { ...(S.tpl.cadence || DEFAULT_TEMPLATES.cadence), [st]: arr } };
  return saveTemplates().then(() => toast('Saved'));
}

/* ============ reply coach ============ */
async function suggestReply(c) {
  const sample = await claude.use('sample').catch(() => null);
  if (!sample) return toast('TARS is not available in this view');
  const last = [...(c.history || [])].reverse().find((h) => h.dir === 'in');
  sheet(`What to say to ${nm(c)}`, `<div class="small muted">They said: "${esc(c.reply_text || last?.body || '')}"</div><div id="sg-out" class="msg b">Thinking…</div>
    <div class="row"><button class="btn sm" type="button" id="sg-copy">Copy text</button><button class="btn sm pri" type="button" id="sg-draft">Put it on Today</button></div>`, async (close) => {
    const out = $('#sg-out'); let text = '';
    const s = S.settings; const v = vehicleOf(c);
    const prompt = `You coach a car salesperson (${s.salesperson || 'the salesperson'} at ${s.dealership || 'a Hyundai dealership'}). A customer just replied. Write the ONE best text message to send back, in the salesperson's voice: friendly-professional, under 300 characters, one question or one appointment offer (never both), no emojis, no fake urgency, never quote a price, payment, rate or approval. If they raised an objection, acknowledge it and move toward a phone call or visit. Output only the message text.

Customer: ${nm(c)}. Stage: ${STAGES[c.stage]?.label}. Vehicle: ${v.label || c.vehicle || 'unknown'}${v.stock ? ' (stock #' + v.stock + ')' : ''}. What held them back: ${c.objection || 'unknown'}.
Recent history (oldest first):
${(c.history || []).slice(-8).map((h) => `${h.dir === 'in' ? 'Customer' : 'Salesperson'} (${h.ch}): ${String(h.body).slice(0, 300)}`).join('\n')}
Their latest message: ${c.reply_text || last?.body || ''}`;
    try { const r = await sample(prompt, { cache: false, onText: ({ text: t }) => { out.textContent = t; } }); text = r.text.trim(); out.textContent = text; }
    catch (e) { out.textContent = e?.code === 'not_granted' ? 'Allow TARS from this page\'s Permissions menu to use this.' : 'Could not get a suggestion right now.'; }
    $('#sg-copy').onclick = () => copy(text);
    $('#sg-draft').onclick = async () => { if (!text) return; const b = blockReason(c, 'sms'); if (b) return toast("Can't text them: " + b); c.draft = { ch: 'sms', body: text, subject: '' }; await saveCustomer(c); close(); toast('On Today under Send these'); };
  });
}

/* ============ TARS (Ask Claude) ============ */
async function openTars() {
  const sample = await claude.use('sample').catch(() => null);
  sheet('Ask TARS', `<div class="tars-log" id="tl">${S.tars.map((m) => `<div class="msg ${m.role === 'user' ? 'u' : 'b'}">${esc(m.content)}</div>`).join('') || `<div class="msg b">Ask me about your customers and stock. For example:\n"Who's interested in stock 24518?"\n"What should I do first today?"\n"Book Mike for a test drive Saturday at 11."\n"Sara bought the RAV4."</div>`}</div>
    ${sample ? `<form class="tars-form" id="tf"><textarea id="ti" rows="2" placeholder="Ask anything…" aria-label="Ask TARS"></textarea><button class="btn pri" type="submit">Ask</button></form>` : '<p class="muted" style="padding:0 16px 16px">TARS isn\'t available in this view. You can ask Claude in the chat instead.</p>'}`, () => {
    if (!sample) return; const log = $('#tl'); const ti = $('#ti');
    ti.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#tf').requestSubmit(); } };
    $('#tf').onsubmit = async (e) => { e.preventDefault(); const q = ti.value.trim(); if (!q) return; ti.value = '';
      log.insertAdjacentHTML('beforeend', `<div class="msg u">${esc(q)}</div>`); const out = document.createElement('div'); out.className = 'msg b muted'; out.textContent = 'Thinking…'; log.append(out);
      const acts = [];
      try {
        const r = await sample([...S.tars.slice(-10), { role: 'user', content: q }].map((m, i, arr) => i === arr.length - 1 ? { role: 'user', content: tarsPrompt(q) } : m), {
          tools: tarsTools(acts), cache: false, onText: ({ text }) => { out.className = 'msg b'; out.textContent = text; },
        });
        out.className = 'msg b'; out.textContent = r.text; if (acts.length) out.insertAdjacentHTML('beforeend', `<div class="acts">${acts.map(esc).join('<br>')}</div>`);
        S.tars.push({ role: 'user', content: q }, { role: 'assistant', content: r.text });
      } catch (err) { out.className = 'msg b'; out.textContent = err?.code === 'not_granted' ? 'TARS needs your permission to ask Claude. Allow it from this page\'s Permissions menu.' : err?.code === 'rate_limited' ? 'Too many questions at once. Try again in a minute.' : 'Something went wrong: ' + (err?.message || 'try again'); }
    };
    ti.focus();
  });
}
function tarsPrompt(q) {
  const s = S.settings; const L = buildList();
  return `You are TARS, the assistant inside a car salesperson's follow-up page. Salesperson: ${s.salesperson || 'not set'} at ${s.dealership || 'not set'}. Now: ${new Date().toString()}.
Stages: new_lead, phone_up, be_back (unsold showroom), appointment, sold, lost, dnc (do not contact). Buckets: Follow Up, Sold, Outreach (lost).
Today's list has ${L.calls.length} calls and ${L.send.length} messages to send${L.auto.length ? `, and ${L.auto.length} emails going out automatically` : ''}.
Rules: use the tools to look things up; never invent customers, numbers or prices. Never text or email someone without recorded permission, never contact dnc customers, no price or payment promises. When asked to write a message, use draft_message so it lands on Today. Be brief like a sharp sales manager, short lists, mention names. Messages: friendly-professional, from the salesperson, under 300 characters for texts, one question per message. If a date, time or customer is unclear, ask first.

Question: ${q}`;
}
function tarsTools(acts) {
  const find = (id) => S.customers.get(id);
  const slim = (c) => ({ id: c.id, name: nm(c), phone: c.phone, email: c.email, stage: c.stage, status: c.status, permission: !!c.consent, stocks: c.stocks, vehicle: c.vehicle, objection: c.objection, last_contact: c.last_contact_at, sold_date: c.sold_date || undefined });
  return [
    { name: 'todays_list', description: "Today's calls and messages to send.", inputSchema: { type: 'object', properties: {} },
      execute: () => { const L = buildList(); return { calls: L.calls.map((i) => ({ customer: nm(i.c), id: i.c.id, why: i.title, type: i.src })), send: L.send.map((i) => ({ customer: nm(i.c), id: i.c.id, channel: i.ch, type: i.src, blocked: i.blocked, message: i.body })) }; } },
    { name: 'search_customers', description: 'Search customers by name, phone, email, stock number, vehicle or notes; optional stage filter.', inputSchema: { type: 'object', properties: { query: { type: 'string' }, stage: { type: 'string' } } },
      execute: ({ query = '', stage } = {}) => { const q = query.toLowerCase(); return [...S.customers.values()].filter((c) => (!stage || c.stage === stage) && (!q || [nm(c), c.phone, c.email, c.vehicle, c.notes, ...(c.stocks || [])].join(' ').toLowerCase().includes(q))).slice(0, 40).map(slim); } },
    { name: 'get_customer', description: 'Full record and recent history for one customer id.', inputSchema: { type: 'object', properties: { id: { type: 'string' } }, required: ['id'] },
      execute: ({ id }) => { const c = find(id); if (!c) throw new Error('No customer with that id'); return { ...slim(c), notes: c.notes, history: (c.history || []).slice(-15), appointments: [...S.appts.values()].filter((a) => a.customer_id === id) }; } },
    { name: 'stock_lookup', description: 'A stock number: the vehicle and everyone interested in it.', inputSchema: { type: 'object', properties: { stock_number: { type: 'string' } }, required: ['stock_number'] },
      execute: ({ stock_number }) => { const s = normStock(stock_number); return { vehicle: S.inv.get(s) || null, interested: [...S.customers.values()].filter((c) => (c.stocks || []).includes(s)).map(slim) }; } },
    { name: 'list_appointments', description: 'Upcoming appointments.', inputSchema: { type: 'object', properties: {} },
      execute: () => [...S.appts.values()].filter((a) => new Date(a.at) > Date.now() - DAY).map((a) => ({ id: a.id, when: fmtWhen(a.at), type: a.type, status: a.status, customer: nm(find(a.customer_id) || {}), customer_id: a.customer_id })) },
    { name: 'set_stage', description: 'Move a customer to a stage (new_lead, phone_up, be_back, appointment, sold, lost, dnc). Restarts that stage\'s follow-up.', inputSchema: { type: 'object', properties: { id: { type: 'string' }, stage: { type: 'string' }, objection: { type: 'string' } }, required: ['id', 'stage'] },
      execute: async ({ id, stage, objection }) => { const c = find(id); if (!c || !STAGES[stage]) throw new Error('Unknown customer or stage'); if (objection) c.objection = objection; setStage(c, stage); await saveCustomer(c); acts.push(`${nm(c)} moved to ${STAGES[stage].label}`); return 'done'; } },
    { name: 'add_note', description: 'Add a note to a customer.', inputSchema: { type: 'object', properties: { id: { type: 'string' }, note: { type: 'string' } }, required: ['id', 'note'] },
      execute: async ({ id, note }) => { const c = find(id); if (!c) throw new Error('No customer'); c.notes = [c.notes, `[${new Date().toLocaleDateString()}] ${note}`].filter(Boolean).join('\n'); await saveCustomer(c); acts.push(`Note added to ${nm(c)}`); return 'done'; } },
    { name: 'draft_message', description: 'Put a text (sms) or email on Today for the salesperson to send. Placeholders like {first_name} work.', inputSchema: { type: 'object', properties: { id: { type: 'string' }, channel: { type: 'string', enum: ['sms', 'email'] }, body: { type: 'string' }, subject: { type: 'string' } }, required: ['id', 'channel', 'body'] },
      execute: async ({ id, channel, body, subject }) => { const c = find(id); if (!c) throw new Error('No customer'); const b = blockReason(c, channel); if (b) throw new Error("Can't message them: " + b); c.draft = { ch: channel, body: render(body, c), subject: render(subject || '', c) }; await saveCustomer(c); acts.push(`Drafted a ${channel === 'sms' ? 'text' : 'email'} for ${nm(c)} on Today`); return 'drafted'; } },
    { name: 'book_appointment', description: 'Book an appointment. when is local date and time like 2026-11-14T11:00. type: test_drive, appraisal, visit, delivery, phone_call.', inputSchema: { type: 'object', properties: { id: { type: 'string' }, when: { type: 'string' }, type: { type: 'string' }, stock_number: { type: 'string' } }, required: ['id', 'when', 'type'] },
      execute: async ({ id, when, type, stock_number }) => { const c = find(id); if (!c) throw new Error('No customer'); if (c.stage === 'dnc') throw new Error('Do not contact'); const at = new Date(when); if (isNaN(at)) throw new Error('Bad date');
        const a = { id: S.db ? S.db.collection('appointments').doc().id : 'a' + Date.now(), customer_id: id, at: at.toISOString(), type: APPT_TYPES[type] ? type : 'visit', stock: normStock(stock_number), status: 'scheduled', notes: '', created_at: nowIso() };
        await saveAppt(a); if (!['appointment', 'sold'].includes(c.stage)) setStage(c, 'appointment'); if (c.status === 'replied') { c.status = 'active'; delete c.reply_text; } await saveCustomer(c); acts.push(`Booked ${nm(c)}: ${fmtWhen(a.at)}`); return { booked: fmtWhen(a.at) }; } },
  ];
}

/* ============ boot ============ */
document.getElementById('tabs').addEventListener('click', (e) => { const a = e.target.closest('a[data-v]'); if (a && location.hash === '#' + a.dataset.v) { e.preventDefault(); go(); } });
window.addEventListener('hashchange', go);
$('#askBtn').onclick = () => openTars();
document.addEventListener('focusout', (e) => { if (e.target.dataset && e.target.dataset.keep !== undefined && e.target.closest('#view')) setTimeout(() => { if (!document.activeElement?.closest?.('#view [data-keep]')) scheduleRender(); }, 150); });
go();
setInterval(() => { if (!document.activeElement?.closest?.('#view [data-keep]')) scheduleRender(); }, 60000);

(async () => {
  const db = window.claude ? await claude.use('db').catch(() => null) : null;
  if (!db) { S.offline = true; S.loaded.customers = true; renderView(); $('#view').insertAdjacentHTML('afterbegin', '<div class="note">Sign in to claude.ai to save your customers. Nothing you enter here can be saved right now.</div>'); return; }
  S.db = db;
  const timer = setTimeout(() => { S.offline = true; scheduleRender(); }, 10000);
  const sub = (col, map, keyField, flag) => db.collection(col).onSnapshot((snap) => {
    map.clear(); for (const d of snap.docs) { const x = d.data(); if (x) map.set(keyField ? x[keyField] || d.id : d.id, { ...x, id: x.id || d.id }); }
    if (!snap.metadata.fromCache) { S.loaded[flag] = true; if (flag === 'customers') { clearTimeout(timer); S.offline = false; } }
    else if (map.size) S.loaded[flag] = true;
    scheduleRender();
  }, () => { S.loaded[flag] = true; S.offline = true; clearTimeout(timer); scheduleRender(); });
  sub('customers', S.customers, null, 'customers'); sub('appointments', S.appts, null, 'appts'); sub('inventory', S.inv, 'stock_number', 'inv');
  db.doc('config/settings').onSnapshot((d) => { if (d.exists) S.settings = { ...DEFAULT_SETTINGS, ...d.data() }; scheduleRender(); }, () => {});
  db.doc('config/automation').onSnapshot((d) => { S.auto = d.exists ? d.data() : null; scheduleRender(); }, () => {});
  db.doc('config/templates').onSnapshot((d) => { if (d.exists) S.tpl = { ...DEFAULT_TEMPLATES, ...d.data() }; scheduleRender(); }, () => {});
})();
</script>
