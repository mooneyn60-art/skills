part: 4
title: A Bug Older Than Dinosaurs Is Eating Your Books
tiktok_caption: silverfish eating my books 😬 older than dinosaurs and it eats glue
  and paper. Would you keep the books? 📚 keep / 🗑️ toss
creature: silverfish
scene: study
