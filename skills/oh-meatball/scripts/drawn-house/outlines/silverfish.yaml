sources:
- 'Connecticut Agricultural Experiment Station, Silverfish and Firebrats (Zygentoma)
  fact sheet, K. Dugas: primitive wingless insects from an ancient lineage; scales
  give a silvery look; two antennae and three tail filaments; hide in cracks by day,
  active at night; silverfish prefer cool humid places such as basements, firebrats
  warm places near furnaces and heating ducts; feed mainly on starch including glue,
  paste and paper, scraping off individual layers until paper is tissue-thin with
  ragged holes; 3 months to 2 years to develop; adults keep molting all their lives;
  lower humidity, store paper in dry airtight containers, discard unused cardboard
  and old newspapers; https://portal.ct.gov/-/media/caes/documents/publications/fact_sheets/entomology/silverfish_firebrats_zygentoma.pdf'
- 'University of Maryland, Bug of the Week (Prof. Michael J. Raupp), ''Ancient insect
  in a modern world: silverfish'': among the most ancient of insects, ''a creature
  older than dinosaurs''; eats paper, book glue and natural fabrics, also cereals
  and preserved meat, and dead insects including other silverfish; pests in libraries
  and museums; https://bugoftheweek.com/blog/2021/2/12/ancient-insect-in-a-modern-world-silverfish-lepismatidae'
- 'Penn State Extension, House Centipedes: house centipedes feed on silverfish, firebrats,
  cockroaches and spiders; https://extension.psu.edu/house-centipedes'
