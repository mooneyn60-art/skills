tt:
  - fact: They love sticky, humid air. Seventy five to ninety percent is perfect.
  - solo: Damp cardboard boxes. Sweaty pipes. Wet basements.
    scene: basement
  - tiny: They'll move into your flour, your grains, and your dried fruit too.
    scene: kitchen
    scene_p: {time: night}
  - count: In perfect conditions, a whole new generation grows up in just twenty five days.
    with: [booklouse, booklouse, booklouse]
  - escalate: And in many species, every single one is a female that lays eggs without a male.
  - solo: Brand new houses can get swarms of them. Fresh drywall holds moisture, and mold grows.
    scene: study
    scene_p: {time: day}
  - calm: But they have one big weakness. They need damp air.
  - escalate: Keep your humidity under fifty percent, and they can die within weeks.
  - fact: Would you still read a book that had them?
  - punch: The real bookworm in your house isn't eating the book. It's eating the mold.
