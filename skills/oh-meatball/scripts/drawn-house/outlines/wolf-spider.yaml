sources:
- 'Missouri Department of Conservation, Field Guide: Wolf Spiders: a row of four small
  eyes below the four larger ones; at night, shine a flashlight held beside your eyes
  and their eyes shine back at you like a cat''s; they do not spin webs, they run prey
  down; the female attaches her egg sac to her spinnerets and later carries her babies
  on her back; body length 1/4 inch to 1 inch depending on species; North American
  wolf spider bites are harmless; https://mdc.mo.gov/discover-nature/field-guide/wolf-spiders'
- 'Penn State Extension, Wolf Spiders: bite if mishandled or trapped next to the skin;
  initial pain and redness, possibly localized swelling, subsiding within 24 hours;
  no serious medical consequences of these bites have been noted; females commonly
  carry their young on their backs in summer; build retreats in soil and under objects
  and come out at night to look for prey; fertilized females overwinter in protected
  places including human-made structures; Hogna carolinensis females 22-35 mm long;
  https://extension.psu.edu/wolf-spiders'
- 'Montana State University Extension, Spiders of Montana: Wolf Spiders: hunting spiders
  that do not build webs to catch prey; excellent vision used for prey capture; females
  attach egg sacs to their spinnerets; hatched spiderlings stay on the mother''s abdomen
  until ready to disperse; https://urbanipm.montana.edu/entomology/resources/fact-sheets/spiders_of_montana/wolf.spiders.html'
- 'University of California Statewide IPM Program, Pest Notes: Black Widow and Other
  Widow Spiders (general spider section): most spiders have venom which they use to
  kill their prey; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7442.html'
- 'UC Riverside, Rick Vetter, How to Identify (and Misidentify) a Brown Recluse Spider:
  recluses have six eyes in three pairs, while most spiders have eight; https://spiders.ucr.edu/recluseid.html'
