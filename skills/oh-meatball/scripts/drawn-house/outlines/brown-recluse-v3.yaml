sources:
- 'University of California Statewide IPM Program, Brown Recluse and Other Recluse Spiders: 6 equal-sized eyes in 3 pairs; uniformly colored abdomen and legs, no leg spines, body no longer than 3/8 inch;
  the violin marking is not a reliable way to identify it; no populations in California; lives in the south central Midwest from southeastern Nebraska to southwestern Ohio, south through Texas to northern
  Georgia; nocturnal, emerging at night to hunt; found in storage boxes and under clutter, and at dawn may shelter in clothing or shoes; about 10% of bites cause moderate or greater tissue damage and scarring,
  the vast majority heal well without medical intervention; deaths reported in children are extremely rare; necrotic wounds are commonly misdiagnosed as brown recluse bites; shake out clothes and shoes,
  use sticky traps along floor boards, move the bed away from the wall; https://ipm.ucanr.edu/home-and-landscape/brown-recluse-and-other-recluse-spiders/'
- 'UC Riverside, Rick Vetter, How to Identify (and Misidentify) a Brown Recluse Spider: six eyes in pairs (one pair in front, one on either side), most spiders have eight; dark violin shape on the cephalothorax
  but not reliable for non-experts; uniformly light-colored legs, no stripes or bands; no spines on the legs; about 3/8 inch body length, longer than 1/2 inch is not a recluse; outside the range map it
  is highly unlikely you have one; https://spiders.ucr.edu/recluseid.html'
- 'Vetter & Barger 2002, Journal of Medical Entomology 39(6): 948-951, An infestation of 2,055 brown recluse spiders (Araneae: Sicariidae) and no envenomations in a Kansas home: 2,055 collected in six months
  (2001) from a home in Lenexa, Kansas, at least 400 large enough to envenomate, and no envenomations of the residents; https://doi.org/10.1603/0022-2585-39.6.948'
