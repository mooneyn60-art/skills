sources:
- 'Bertone, M.A. et al. (2016) Arthropods of the great indoors: characterizing diversity inside urban and suburban homes. PeerJ 4:e1582 (abstract via Europe PMC): 50 houses around Raleigh NC; 32-211 morphospecies
  of arthropods per house; 73% of indoor diversity was true flies, spiders, beetles and wasps/ants; https://doi.org/10.7717/peerj.1582'
- 'UC IPM Pest Notes: Spiders (Pub. 7442): most spiders have venom which they use to kill their prey, only those whose venom typically causes a serious reaction in humans are called toxic; the common house
  spider, Parasteatoda tepidariorum, makes a cobweb in corners of rooms and in windows; cobweb spiders feed on insects that walk or fly into their webs and hang upside down in irregular webs; the jaws of
  most spiders are too small to bite humans; the cellar spider''s fangs are too short to pierce skin in most cases; adult female black widows (shiny black, red hourglass) are the most common spider capable
  of seriously injuring people in California, and only larger immature and adult females can bite through skin; focus control on removing webs and hiding places, pesticides are not generally needed; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7442.html'
- 'UC Riverside, Spider Research (R. Vetter), the Daddy-Long-Legs myth: harvestmen do not have venom glands, fangs or any other way to chemically subdue food, so they have no injectable toxins; for pholcid
  daddy-longlegs spiders there is no reference to a bite harming a human; the "most venomous spider" tale is a myth; https://spiders.ucr.edu/daddy-long-legs'
- 'UC IPM, Brown Recluse and Other Recluse Spiders: 6 eyes in 3 pairs; https://ipm.ucanr.edu/home-and-landscape/brown-recluse-and-other-recluse-spiders/ and UC Riverside (R. Vetter), How to Identify a Brown
  Recluse: six eyes, most spiders have eight; https://spiders.ucr.edu/recluseid.html'
- 'Penn State Extension, Cellar Spiders (S. Jacobs): often called daddy longlegs; loose webs in corners of basements; when disturbed they vibrate rapidly in the web; https://extension.psu.edu/cellar-spiders'
- 'Vetter & Barger 2002, Journal of Medical Entomology 39(6): 948-951, An infestation of 2,055 brown recluse spiders and no envenomations in a Kansas home; https://doi.org/10.1603/0022-2585-39.6.948'
