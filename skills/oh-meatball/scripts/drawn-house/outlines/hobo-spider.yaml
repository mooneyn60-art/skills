sources:
- 'Washington State University Pestsense, Hobo spider: 1-1 3/4 inches including legs, swift-running; funnel web in dark moist
  areas, often basements, waits at the funnel mouth; improperly identified as dangerous, recent research has not shown it
  harmful to humans; https://pestsense.cahnrs.wsu.edu/fact-sheet/hobo-spider/'
- 'Gaver-Wainwright, Zack, Foradori & Lavine 2011, Journal of Medical Entomology 48(2): 382-388: the European hobo spider
  has been implicated as medically important in the Pacific Northwest; only ubiquitous bacteria on the spiders, none transferred
  MRSA; venom not harmful to vertebrate red blood cells; bacterial infections such as MRSA are often misdiagnosed as spider
  bites; https://doi.org/10.1603/me09224'
- 'McKeown, Vetter & Hendrickson 2014, Toxicon 84: 51-55, Verified spider bites in Oregon (USA) with the intent to assess
  hobo spider venom toxicity: 33 verified bites, none developed significant symptoms or dermonecrosis; one hobo spider bite
  (pain, redness, calf twitching, resolved in 12 h) and one giant house spider bite, which is readily confused with the hobo;
  https://doi.org/10.1016/j.toxicon.2014.03.009'
