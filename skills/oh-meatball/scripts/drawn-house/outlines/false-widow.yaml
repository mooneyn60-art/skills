sources:
- 'Natural History Museum (London), How dangerous are false widow spiders?: looks similar
  to the more dangerous black widows with a similar dark, globular body; the pattern
  on its back is often described as skull-shaped; usually the only symptom of a bite
  is pain at the site which may radiate, ordinarily lasting one to 12 hours, no worse
  than a wasp sting; first recorded in the UK in the 1870s, probably a stowaway from
  its native Madeira and Canary Islands, strong foothold only since the 1980s; body
  length 7-14 mm, females larger; indoors often in kitchens and conservatories; webs
  usually at least 1.5 m off the ground; https://www.nhm.ac.uk/discover/how-dangerous-are-false-widow-spiders.html'
- 'University of Galway (NUI Galway) Venom Systems Lab, May 2021, New study confirms
  noble false widow spider bites can result in hospitalisation (Dunbar et al., Clinical
  Toxicology, https://doi.org/10.1080/15563650.2021.1928165): some victims have symptoms
  very similar to true black widow bites and some severe cases require hospitalisation;
  only cases with a clear identification of the spider were used, some confirmed by
  DNA; most cases have a mild outcome; https://universityofgalway.ie/about-us/news-and-events/news-archive/2021/may/new-study-confirms-noble-false-widow-spiders-bites-can-result-in-hospitalisation.html'
- 'University of California Statewide IPM Program, Pest Notes: Black Widow and Other
  Widow Spiders: adult female has a shiny black body and a red or orange hourglass
  on the underside of the large round abdomen; hangs upside down in an irregular,
  tough, sticky cobweb in dark, sheltered places such as wood piles and garages; males
  are one-half to two-thirds the length of the female; death from a bite is very unlikely;
  https://ipm.ucanr.edu/PMG/PESTNOTES/pn7442.html'
- 'MedlinePlus (U.S. National Library of Medicine), Black widow spider bite: muscle
  pain spreading from the bite, painful cramps, sweating; https://medlineplus.gov/ency/article/002858.htm'
