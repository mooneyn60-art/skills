sources:
- 'Washington State University Pestsense, Giant house spider: body 1/2-1 inch, leg span up to 4 inches; flat sheet web with
  a funnel; most seen mid-summer to early fall when males are highly mobile; smaller males often mistaken for hobo spiders;
  not aggressive, runs when startled; bite not known to threaten humans, bring the spider for identification if bitten; prefers
  garages and basements, found in sinks and tubs searching for water; color and markings not reliable for ID; https://pestsense.cahnrs.wsu.edu/fact-sheet/giant-house-spider/'
- 'The Wildlife Trusts, WildlifeWatch: Giant house spider: one of our fastest invertebrates, running up to half a metre per
  second; https://wildlifewatch.org.uk/wildlife-explorer/invertebrates/spiders/giant-house-spider'
- 'McKeown, Vetter & Hendrickson 2014, Toxicon 84: 51-55, Verified spider bites in Oregon (USA) with the intent to assess
  hobo spider venom toxicity: 33 verified bites, none developed significant symptoms or dermonecrosis; one hobo spider bite
  (pain, redness, calf twitching, resolved in 12 h) and one giant house spider bite, which is readily confused with the hobo;
  https://doi.org/10.1016/j.toxicon.2014.03.009'
