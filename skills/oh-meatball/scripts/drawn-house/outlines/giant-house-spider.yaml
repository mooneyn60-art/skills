tt:
- count: Its body is half an inch to an inch long.
- fact: The smaller males get mistaken for hobo spiders.
- calm: It's not aggressive. Startle it, and it runs away fast.
- fact: In a study of thirty three confirmed spider bites in Oregon, one was a giant house spider.
- fact: None of those bites caused serious symptoms.
- fact: Color and markings won't reliably tell you which spider it is.
- fact: If one bites you, bring the spider along, so an expert can identify it.
- fact: Around Seattle's Puget Sound, giant house spiders are far more common than hobo spiders.
- fact: Indoors, they usually stay down on the floor.
- fact: So a big one in your tub in the fall is probably a wandering male.
- fact: Would you trap it in a cup, or run?
