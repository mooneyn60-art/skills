- fact: Its rash looks like little pimples.
- fact: Kids often get it on the head, face, neck, palms, and the soles of the feet.
- escalate: And you can pass it on before you even feel the itch.
  gag:
    mark: alarm
    at: 50%
- fact: Less often, it spreads through shared clothes, towels, or bedding.
- solo: A severe form, crusted scabies, is very contagious.
  scene: skin
- fact: Doctors treat it with prescription creams, lotions, or pills.
- fact: No store bought product has been tested and approved for it.
- fact: Itching like crazy every night? See a doctor.
- fact: The mites are microscopic. Far too small to see.
- fact: With crusted scabies, a late diagnosis can lead to outbreaks.
- calm: The good news? A prescription treatment kills the mites.
- fact: Would you tell your friends, or keep it secret?
