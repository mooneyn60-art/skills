sources:
- 'CDC, About Scabies: infestation by the human itch mite, which burrows into the upper skin layer where it lives and lays
  eggs; intense itching especially at night and a pimple-like rash; children often on head, face, neck, palms and soles; spread
  mainly by direct prolonged skin-to-skin contact, less often by shared clothing, towels or bedding; first infestation symptoms
  take 4-8 weeks, but people can spread it before symptoms; mites do not survive more than 2-3 days away from human skin;
  prescription scabicides; no non-prescription product tested and approved; crusted scabies is very contagious; https://www.cdc.gov/scabies/about/index.html'
