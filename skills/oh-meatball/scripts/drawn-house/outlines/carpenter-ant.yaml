sources:
- 'University of Minnesota Extension, Carpenter ants: they do not eat wood, they remove it to make galleries for nesting;
  coarse sawdust near a nest is a sign; indoor nests are usually in moist or decayed wood around tubs, sinks, dishwashers
  and roofs; workers about 3/8-1/2 inch, queens about 1 inch; parent colonies often outdoors with satellite nests indoors;
  workers forage mainly sunset to midnight; eat insects, honeydew, meats and sweets; many winged ants indoors in late winter-spring
  suggest a nest inside, a few winged queens may only be seeking a nest site; find and destroy the nest, replace damaged wood,
  fix moisture; https://extension.umn.edu/insects-infest-homes/carpenter-ants'
- 'University of Maryland Extension, Ants and Termites: How to Tell the Difference: ants have elbowed antennae, termites straight
  beaded ones; ants have a pinched waist, termites do not; ant front wings are longer than hind wings, termite wings are about
  equal in length; https://extension.umd.edu/resource/ants-and-termites-how-tell-difference'
