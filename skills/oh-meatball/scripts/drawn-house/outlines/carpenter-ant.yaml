tt:
- fact: They pick wet or rotting wood, around tubs, sinks, dishwashers, and roofs.
- solo: They eat other insects, sweet honeydew, meat, and your sweets.
  scene: garden
  scene_p:
    time: day
- escalate: Lots of winged ants inside, in late winter or spring? There's probably a nest in the house.
- calm: But a few winged queens may just be looking for a home.
- fact: And they're not termites. Ants have bent antennae and a skinny waist.
- fact: To stop them, fix the leaks, and dry out the wood.
- fact: Then find the nest, and replace the damaged wood.
- fact: The parent nest is often outside, in a stump, a tree, or a log.
- fact: Inside, workers may nest in drier spots, like insulation or hollow doors.
- fact: The nests are hidden, so experts suggest calling a pest professional.
- fact: Would you go looking for the nest yourself?
