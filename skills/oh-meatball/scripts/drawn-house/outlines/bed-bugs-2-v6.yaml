sources:
- 'CDC, About Bed Bugs: 1-7 mm (about Lincoln''s head on a penny); bite marks can take up to 14 days to develop in some people; bed bugs can travel over 100 feet in a night but tend to live within 8 feet
  of where people sleep; rusty-colored blood spots, a sweet musty odor; not known to spread disease; https://www.cdc.gov/bed-bugs/about/index.html'
- 'Univ. of Kentucky Entomology, Bed Bugs (ENTFACT-636, M. Potter): 1-4 months without feeding in heated buildings, a year or longer at 55 F or less; lifespan about 10 months; eggs hatch in about a week;
  can mature in a month at 70-80 F; about 30 percent of people do not react even when bitten repeatedly; fit crevices no wider than a toothpick; crawl room to room and floor to floor via cracks; dark spotting
  and tan shed skins; laundering 120 F minimum or a dryer at medium-high heat 10-20 minutes; freezing takes one to two weeks; https://entomology.mgcafe.uky.edu/ef636'
