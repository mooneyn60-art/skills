title: Tiny Mites Live in Your Face Right Now
tiktok_caption: "demodex face mites 😳 they live in your pores and crawl out at night to mate. Would you rather not know? 🙈 tell me / 🙅 don't"
creature: demodex
scene: skin
scene_p: {night: true}
music: mystery
caption_y: 1700
next: Part four is in your books.
