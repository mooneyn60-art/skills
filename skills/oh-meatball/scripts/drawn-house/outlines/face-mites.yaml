next_scene_p: {time: night}
sources:
  - "University of Reading news, 'Secret lives of skin mites in our faces' (2022, on Smith et al., Molecular Biology and Evolution, doi:10.1093/molbev/msac125): carried by almost every human; about 0.3 mm long; live in hair follicles on the face, including the eyelashes; eat the sebum in the pores; active at night, moving between follicles looking to mate; passed from mother to baby during or after birth; legs powered by three single-cell muscles; cannot make melatonin and use the melatonin human skin secretes at dusk; lost the gene that makes animals wake in daylight; the study confirmed they do have anuses; numbers peak in adults as pores grow bigger; https://www.reading.ac.uk/news/2022/Research-News/Secret-lives-of-skin-mites-in-our-faces"
  - "Thoms et al. (2014), 'Ubiquity of Demodex mites in humans', PLOS ONE 9(8): e106265: Demodex DNA detected in 100% of adults over 18 sampled (n = 19); https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0106265"
  - "DermNet (New Zealand Dermatological Society), Demodex: semi-transparent elongated body about 0.3-0.4 mm, eight short legs on the front body segment, invisible to the naked eye; most people carry them without symptoms; https://dermnetnz.org/topics/demodex"
