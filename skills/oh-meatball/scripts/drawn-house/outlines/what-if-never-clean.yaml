sources:
- 'University of Kentucky Entomology, Fruit Flies (Ent-621): females lay about 500 eggs; egg to adult takes about a week; eggs laid on the surface of fermenting foods or other moist organic material; they
  also breed in drains, garbage disposals, trash containers, mops and rags; https://entomology.mgcafe.uky.edu/ef621'
- 'Iowa State University Extension, Yard and Garden, Moth fly (drain fly): usually originate in sink, bathtub, shower or floor drains, especially slow-running or seldom-used ones; larvae feed on the gelatinous
  film (slime) that builds up inside drains; https://yardandgarden.extension.iastate.edu/encyclopedia/moth-fly'
- 'University of Kentucky Entomology, Cockroach Control Manual (Ent-614): clean up spills and food waste, do not leave dirty dishes or pet food out overnight, do not let garbage pile up; up to 40 nymphs
  emerge from each German cockroach egg case; the German cockroach can produce several thousand offspring in less than a year; https://entomology.mgcafe.uky.edu/ef614'
- 'University of Kentucky Entomology, House Dust Mites (Ent-646): primary food is dander (skin scales) shed by people and pets; thousands of mites in a single gram of house dust are not uncommon; an infested
  mattress can contain millions; https://entomology.mgcafe.uky.edu/ef646'
- 'University of Kentucky Entomology, Carpet Beetles (Ent-601): carpet beetles thrive on lint, hair and debris under baseboards and in vents and ducts; a favored food of the larvae is dead insects; https://entomology.mgcafe.uky.edu/ef601'
- 'Penn State Extension, House Centipedes: feed on silverfish, firebrats, carpet beetle larvae, cockroaches, spiders and other small arthropods; frequent sightings indicate some prey arthropod is in abundance;
  https://extension.psu.edu/house-centipedes'
- 'Connecticut Agricultural Experiment Station, House Centipede fact sheet: 15 pairs of legs (thirty legs); hunts cockroach nymphs, flies, silverfish and spiders; https://portal.ct.gov/-/media/caes/documents/publications/fact_sheets/entomology/house_centipede_scutigera.pdf'
- 'Timeline framing: the DAY numbers are a what-if story, not measured timelines; each day only uses a rate the sources give (egg to adult in about a week; thousands of roaches in less than a year).'
