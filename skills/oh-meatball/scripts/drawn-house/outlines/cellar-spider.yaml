tt:
  - fact: Poke its web, and it shakes so fast it turns into a blur.
    hero_p: {shiver: 1.0}
  - fact: That blur makes it hard for a hunter to grab.
  - fact: Its web is a messy tangle, up in the corner of the ceiling.
  - fact: It loves dark, damp places. Basements. Crawl spaces.
  - fact: "And no, it's not the daddy longlegs from the garden. That one is not even a spider."
  - scale: Its legs can be ten times longer than its body.
    how: grow
  - fact: And the mom carries her eggs in her jaws until they hatch.
  - fact: It eats flies, mosquitoes, and other spiders.
  - count: So every cellar spider in the corner means fewer bugs in your house.
  - fact: Want fewer? Dry out the basement, and sweep the corners.
  - punch: The scariest-looking spider in your house is guarding it.
