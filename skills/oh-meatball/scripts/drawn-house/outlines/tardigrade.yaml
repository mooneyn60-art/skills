sources:
- 'Encyclopaedia Britannica, Tardigrade: microscopic invertebrates, most under 0.5
  mm (1/50 inch); four pairs of stubby clawed legs; live in films of water on moss
  and lichen, and in fresh water and the sea; first described by J. A. E. Goeze in
  1773, who called them little water bears; feed by piercing plant cells with stylets
  and sucking the contents; survive drying by entering a tun state (cryptobiosis)
  with almost no metabolism, then revive in water; more than 1,000 species; https://www.britannica.com/animal/tardigrade'
- 'Jönsson et al. 2008, Current Biology, Tardigrades survive exposure to space in
  low Earth orbit (FOTON-M3, 2007): dried tardigrades survived open space vacuum,
  and some survived space vacuum plus solar UV radiation; https://doi.org/10.1016/j.cub.2008.06.048'
- 'Tsujimoto, Imura & Kanda 2016, Cryobiology, Recovery and reproduction of an Antarctic
  tardigrade retrieved from a moss sample frozen for over 30 years: tardigrades from
  moss collected in 1983 and stored frozen at -20 C were thawed in 2014; two revived
  and one reproduced; https://doi.org/10.1016/j.cryobiol.2015.12.003'
- 'Natural History Museum (London), Tardigrades: active tardigrades are not especially
  tough, their resilience comes from the dried tun state; you can find them by soaking
  moss in water and looking with a microscope; https://www.nhm.ac.uk/discover/news/2019/september/tardigrades-are-not-invincible.html'
