- solo: After a heavy rain, winged termites swarm out, to start new colonies.
  scene: garden
  scene_p:
    time: day
- solo: Most of them get eaten in the air.
  scene: garden
  scene_p:
    time: dusk
- solo: A new queen usually lands less than a hundred meters from home.
  scene: garden
  scene_p:
    time: day
- fact: Termite or flying ant? Check three things.
- fact: A termite's antennae are straight. An ant's bend, like an elbow.
- fact: A termite has a thick waist. An ant's is pinched thin.
- fact: And a termite's four wings are all about the same length.
- fact: Drywood termites leave tiny six sided pellets under their holes.
- calm: But a swarm outside doesn't always mean your house has them.
- fact: Experts say get an inspection every three to five years.
