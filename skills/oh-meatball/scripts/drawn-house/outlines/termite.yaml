- name: Termites. Pale, soft workers that eat wood.
- xray: Tiny microbes in their gut turn the wood into food.
- solo: Underground termites build mud tubes up to the wood, to stay damp.
- fact: The wood looks fine outside. But it's thin, and a screwdriver pokes right through.
