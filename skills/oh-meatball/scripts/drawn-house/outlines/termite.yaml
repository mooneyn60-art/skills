sources:
- 'UC Statewide IPM Program, Pest Notes: Termites: subterranean termites live in soil and reach wood through tunnels or shelter
  (mud) tubes made of saliva, soil and wood; drywood termites nest above ground and leave six-sided fecal pellets below exit
  holes; protists in the gut digest cellulose; colonies range up to hundreds of thousands, possibly millions; a 2,400 sq ft
  home can host several colonies; Reticulitermes swarm in spring or fall on clear days after heavy rain, most swarmers are
  eaten by predators; seeing swarms does not always mean the building is infested; damaged wood has a thin, easily punctured
  surface; inspect every 3-5 years; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7415.html'
- 'University of Maryland Extension, Ants and Termites: How to Tell the Difference: ants have elbowed antennae, termites straight
  beaded ones; ants have a pinched waist, termites do not; ant front wings are longer than hind wings, termite wings are about
  equal in length; https://extension.umd.edu/resource/ants-and-termites-how-tell-difference'
