sources:
- 'University of California IPM, Pest Notes: House Mouse (Publication 74106): mice
  squeeze through openings as small as 1/4 inch; can jump up to 12 inches from the
  floor onto a flat surface; females have 5-10 litters a year of about 5 or 6 pups;
  sexually mature 5-6 weeks after birth; do not need to drink water to survive if
  food supplies moisture; mostly nocturnal; gnaw electrical wires, gas lines, appliance
  cords and storage containers; seldom venture more than 30 feet from nest and food;
  can carry leptospirosis, salmonella and LCM virus; urine is a major allergen linked
  to early-onset asthma in sensitive children; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7483.html'
- 'Texas A&M AgriLife Extension, Rodents and Rodent Control (public health license
  course, 2024): house mouse leaves 50 to 75 droppings a day, droppings 1/8-1/4 inch
  with pointed ends; up to 3,000 urine microdroplets produced daily; many live outside
  during summer; https://extensionentomology.tamu.edu/wp-content/uploads/sites/6/2024/02/Rodents-and-rodent-control-public-health-license-course.pdf'
