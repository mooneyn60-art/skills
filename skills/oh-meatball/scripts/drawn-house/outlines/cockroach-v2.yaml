sources:
- 'Scientific American, Fact or Fiction?: A Cockroach Can Live without Its Head (C. Choi, 2007), quoting entomologist Christopher
  Tipping (Delaware Valley College) and physiologist Joseph Kunkel (UMass Amherst): decapitated American cockroaches, necks
  sealed, lasted several weeks in a jar; open circulatory system with low pressure, necks often seal by clotting; they breathe
  through spiracles in body segments without needing the brain; can survive weeks on one meal; eventually die of mold, bacteria
  or virus; https://www.scientificamerican.com/article/fact-or-fiction-cockroach-can-live-without-head/'
- 'UC Berkeley News, Cockroach inspires robot that squeezes through cracks (2016, Jayaram and Full, PNAS): cockroaches compress
  to about a quarter of their standing height, about two stacked pennies; withstand forces of 900 times their body weight
  without injury; https://news.berkeley.edu/2016/02/08/cockroach-inspires-robot-that-squeezes-through-cracks/'
- 'University of Kentucky Entomology, Cockroach Control Manual (ENTFACT-614): German cockroach most common indoors; most active
  at night, hide in cracks near food, warmth and moisture; eat nearly all human food plus soap, toothpaste, glue, hair; up
  to 40 young hatch from one German cockroach egg case; one mated female can produce thousands of cockroaches in less than
  a year; droppings and shed skins cause allergies and can trigger asthma, especially in children; can spread microbes that
  cause food poisoning; https://entomology.mgcafe.uky.edu/ef614'
