sources:
  - "University of California IPM, Drain flies (Moth flies, Pest Notes 7487): small fuzzy flies about 1/8 inch, wings held roof-like over the body and covered with hairs; weak fliers that make short hopping flights; larvae live in the gelatinous film in drains and feed on the organic material and microorganisms in it; larvae breathe through a tube at the rear end; to find the source, tape over drains overnight and look for flies on the tape; the best control is cleaning the film out with a stiff brush, pouring chemicals down the drain is usually not effective; they do not bite; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7487.html"
  - "Penn State Extension, Moth flies (drain flies): females lay 30-100 eggs in the drain film; the life cycle takes about 8 to 24 days; adults live about two weeks; also called filter flies because they breed in huge numbers in sewage treatment trickling filters; https://extension.psu.edu/moth-flies"
