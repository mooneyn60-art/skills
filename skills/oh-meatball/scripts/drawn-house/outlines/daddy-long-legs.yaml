sources:
- 'UF/IFAS Extension Manatee County, A Tale of Three Daddy Long Legs: harvestmen (Opiliones) have one fused body, two eyes,
  no silk and no venom, omnivores; cellar spiders (Pholcidae) have two body parts, eight eyes, silk, and venom considered
  medically insignificant; crane flies are insects that don''t bite or sting; https://blogs.ifas.ufl.edu/manateeco/?p=9645'
- 'Penn State Extension, Cellar Spiders: loose irregular webs in dark damp places; vibrate rapidly in the web when disturbed;
  harmless to people; https://extension.psu.edu/cellar-spiders'
- 'UC Riverside, Rick Vetter, The daddy-long-legs myth: no evidence pholcid venom is dangerous to people; the ''fangs too
  short'' claim is false; https://spiders.ucr.edu/daddy-long-legs-myth'
- 'Burke Museum, Spider Myths (R. Crawford): cellar spiders are a major predator of other spiders, invading webs; females
  carry their eggs in their jaws; https://www.burkemuseum.org/collections-and-research/biology/arachnology-and-entomology/spider-myths'
- 'MythBusters episode 13 (2004): Adam Savage let a daddy-longlegs (cellar) spider bite him and felt only a brief mild burning
  sensation.'
