sources:
- 'Connecticut Agricultural Experiment Station, House Centipede fact sheet (K. Dugas): nocturnal; fast runners that chase prey; flees when discovered; frequents basements, cellars and first-floor bathrooms;
  most are never seen; venomous forcipules sting prey; stinging a human is very rare, only from rough handling; hunts bed bugs and cockroach nymphs; reduce humidity and exclude the insects they prey on;
  antennae look like legs; 15 pairs of legs; upwards of 3 years to mature, can live up to 7 years; https://portal.ct.gov/-/media/caes/documents/publications/fact_sheets/entomology/house_centipede_scutigera.pdf'
- 'Penn State Extension, House Centipedes: comes out at night; feeds on silverfish, carpet beetle larvae, cockroaches, spiders; harmless; https://extension.psu.edu/house-centipedes'
- 'Washington State University Extension PestSense, House centipede: usually active at night; https://pestsense.cahnrs.wsu.edu/fact-sheet/house-centipede/'
yt:
- hook: Turn on your bathroom light at three A.M.
- chase: That blur running for the drain? Thirty legs.
  scene: basement
- xray: It works the night shift. Hunting roaches.
  scene: kitchen
- scale: Its feelers look like legs. Which end is the face?
  scene: bedroom
- punch: Turn it off. Let it work.
tt:
- fact: It's a house centipede, and it hunts at night.
  scene: basement
- chase: It's a fast runner. It chases down its food.
  scene: kitchen
- fact: Silverfish, spiders, cockroaches, carpet beetle larvae.
  scene: bedroom
- calm: When you flip on the light, it runs. It doesn't want you.
  scene: basement
- fact: That's why most people never see theirs.
  scene: kitchen
- fact: By day it hides in basements, cellars and bathrooms.
  scene: basement
- escalate: Its long feelers look just like legs.
  scene: bedroom
- calm: So a predator can't tell which end is the face.
  scene: kitchen
- fact: Fifteen pairs of legs. About three years to grow up.
  scene: basement
- escalate: And it can live up to seven years. In your house.
  scene: bedroom
- fact: Bug experts say it's harmless to people.
  scene: kitchen
- xray: It stings its prey with legs that turned into fangs.
  scene: kitchen
- fact: Will it sting you? Almost never. Only if you grab it hard.
  scene: bedroom
- fact: It even eats bed bugs and baby cockroaches.
  scene: basement
- calm: Want fewer of them? Dry out the damp spots.
  scene: kitchen
- fact: The bugs it eats move out, and so does it.
  scene: basement
- fact: Even silverfish and moths. It eats the bugs you hate.
  scene: bedroom
- calm: It would rather run than fight you.
  scene: kitchen
- punch: So next time, turn the light off and let it work. Would you?
