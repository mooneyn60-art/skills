sources:
- 'University of Kentucky Entomology, Bed Bugs (ENTFACT-636, M. Potter): adults about 3/16 inch, reddish-brown, oval and flattened;
  fit into crevices no wider than a toothpick; active mainly at night; the bite is painless and a blood meal takes about three
  to ten minutes; nymphs and adults persist months without feeding, up to about a year at 55 F or cooler; females lay one
  or more eggs a day, hundreds in a lifetime; eggs about the size of a dust speck; nymphs molt five times and need a blood
  meal between each molt; disease transmission to humans not proven and considered unlikely; hide in mattress seams, box springs,
  bed frames, headboards; https://entomology.mgcafe.uky.edu/ef636'
- 'US EPA, Bed Bugs: Appearance and Life Cycle: adult about the size of an apple seed; https://www.epa.gov/bedbugs/bed-bugs-appearance-and-life-cycle'
- 'US Centers for Disease Control and Prevention, About Bed Bugs: 1-7 mm; not known to spread disease; bite at night while
  people sleep; stay near where people sleep; spread by hiding in luggage, bags, folded clothes and furniture; https://www.cdc.gov/bed-bugs/about/index.html'
- 'University of Kentucky College of Agriculture news, UK entomologists help sequence bed bug genome: traumatic insemination,
  ''a male pierces the female''s body and deposits sperm into her body cavity''; https://news.mgcafe.uky.edu/article/uk-entomologists-help-sequence-bed-bug-genome'
- 'Wang et al. 2009, Journal of Economic Entomology (hosted by Purdue Extension), bed bug pitfall traps: carbon dioxide and
  heat both attract bed bugs, CO2 more strongly; https://www.extension.entm.purdue.edu/bedbugs/pdf/BedBugTrap.pdf'
