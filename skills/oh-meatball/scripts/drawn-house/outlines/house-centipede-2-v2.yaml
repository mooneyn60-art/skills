tt:
- fact: It has fifteen pairs of legs, and it uses them to chase.
  scene: kitchen
- calm: It stings its prey with legs that turned into fangs.
  scene: basement
- fact: Will it sting you? Almost never. Only if you grab it hard.
  scene: kitchen
- fact: It even eats moths and carpet beetle larvae.
  scene: bedroom
- chase: It would rather run. It's one of the fastest things in your house.
  scene: basement
- escalate: And it hunts at night, while you sleep.
  scene: bedroom
- fact: Most people never even see theirs.
  scene: kitchen
- calm: So the one you just saw? It's working for you.
  scene: basement
- fact: Its long feelers look just like its legs.
  scene: bedroom
- calm: So a predator can't tell which end is the face.
  scene: kitchen
- fact: A baby hatches with only four pairs of legs.
  scene: basement
- escalate: It grows more every time it molts, until it has fifteen pairs.
  scene: bedroom
- fact: It takes about three years to grow up, and it can live up to seven.
  scene: kitchen
- fact: And the female's back legs are almost twice as long as her body.
  scene: basement
- fact: They hide by day in basements, cellars and bathrooms.
- calm: Bug experts say don't bother spraying it.
- fact: Dry out the damp spots, and the bugs it eats move out.
- punch: Fewer bugs, fewer centipedes. So, would you let it stay?
