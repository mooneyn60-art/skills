sources:
- 'Autumn et al. 2000, Nature, Adhesive force of a single gecko foot-hair; and Lewis
  & Clark College / UC Berkeley summaries: gecko toe pads carry millions of microscopic
  hairs (setae) that branch into hundreds of even finer tips (spatulae); they stick
  by van der Waals forces, dry, with no glue or suction; https://www.nature.com/articles/35015073'
- 'Smithsonian''s National Zoo, Leopard gecko / gecko facts; San Diego Zoo Wildlife
  Alliance, Lizards: most geckos have no movable eyelids, a clear scale covers the
  eye and the gecko licks it clean with its tongue; many lizards, including geckos,
  can drop the tail to escape a predator, the dropped tail keeps wriggling, and it
  grows back with cartilage instead of bone; https://animals.sandiegozoo.org/animals/lizard'
- 'University of Florida IFAS (Wildlife Ecology, Florida''s introduced reptiles: Hemidactylus
  geckos), Common house gecko and Mediterranean house gecko: nocturnal, often seen
  on walls and around outdoor lights hunting insects attracted to the light; the common
  house gecko is native to Southeast Asia and has spread around the world with people
  and cargo; house geckos are harmless to people; they make chirping calls; https://edis.ifas.ufl.edu/publication/UW259'
