sources:
- 'Penn State Extension, Brown Marmorated Stink Bug: accidentally introduced from East Asia, first collected in Allentown,
  PA in 1998; adults seek sheltered places such as houses in fall; scent glands release defensive chemicals that can be an
  aeroallergen; crushing on skin can cause dermatitis in a small percentage of people; does not reproduce in or damage structures;
  feeds on apples (cat-facing makes fruit unmarketable), peaches, tomatoes, corn and more; adults about 17 mm, nearly as wide
  as long, banded antennae; vacuuming works but the vacuum may keep the smell; seal entry points with caulk; https://extension.psu.edu/brown-marmorated-stink-bug'
- 'Inkley 2012, Journal of Entomological Science 47(2): 125-130, Characteristics of home invasion by the brown marmorated
  stink bug: 26,205 adults collected inside one home in Washington County, Maryland over a 181-day study (January-June 2011);
  blocking exits from walls into living space reduced the collection rate but did not halt it; https://doi.org/10.18474/0749-8004-47.2.125'
