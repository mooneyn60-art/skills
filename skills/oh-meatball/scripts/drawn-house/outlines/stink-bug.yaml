- fact: For some people, the smell even sets off allergies.
- fact: And crushing one on bare skin gives a few people a rash.
- fact: To keep them out, seal the cracks around windows and doors.
- fact: In that Maryland house, blocking the walls slowed them down, but didn't stop them.
- fact: Would you vacuum them, or flush them?
