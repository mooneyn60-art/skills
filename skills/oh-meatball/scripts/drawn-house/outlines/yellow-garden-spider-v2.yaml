sources:
- 'Penn State Extension, Yellow Garden Spider (Argiope aurantia): females 19-28 mm, males 5-8 mm; webs 50-100 cm in diameter
  are not uncommon; a white zigzag stripe down the centre, the stabilimentum, whose exact function is unclear; people are
  not likely to be bitten unless they handle a female with an egg sac in the web, and a bite would cause no more discomfort
  than a wasp or bee sting for most people; not medically important; papery egg sacs laid in late summer, 500-1,000 spiderlings
  emerge in early spring; https://extension.psu.edu/yellow-garden-spider'
- 'Missouri Department of Conservation, Field Guide: Black-and-Yellow Garden Spider: harmless; circular web about two feet
  across with a vertical zigzag silk band; females 3/4 to 1 inch, males about 1/4 inch and rarely noticed; makes its web vibrate
  when disturbed; eats mostly grasshoppers and katydids; papery tan egg cases a little smaller than ping-pong balls that can
  contain over 1,000 eggs each; the female slows and dies in the first frosts; https://mdc.mo.gov/discover-nature/field-guide/black-yellow-garden-spider'
- 'National Wildlife Federation, Wildlife Guide: Yellow Garden Spider: venom harmless to humans; stabilimentum purpose unknown,
  it may warn birds away from the web; may eat and respin its web each night; males usually die after mating; https://www.nwf.org/Educational-Resources/Wildlife-Guide/Invertebrates/Yellow-Garden-Spider'
