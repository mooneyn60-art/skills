sources:
- 'Oklahoma State University Extension, Jumping spiders: hunt during the day; often seen on windows and walls where insect
  prey gathers; https://extension.okstate.edu/programs/digital-diagnostics/insects-and-arthropods/jumping-spiders'
- 'Utah State University Extension, Jumping Spiders: most visible near windows and bright spots; not known to pose a health
  hazard; beneficial; catch in a jar and release outside; https://extension.usu.edu/planthealth/ipm/notes_nuisance/jumping-spiders.php'
- 'Australian Museum, Jumping spiders (Salticidae): daylight hunters with large eyes and excellent vision, used to track,
  stalk and judge distance before leaping; hunt by stalking, not webs; body 3-12 mm; males use colourful courtship displays;
  peacock spiders raise a coloured abdominal flap; https://australian.museum/learn/animals/spiders/jumping-spiders/'
- 'Wikipedia, Jumping spider (citing Land 1969, Foelix): largest spider family, over 6,000 described species; eight eyes,
  large front pair for 3D vision and range-finding; attaches a silk dragline before a jump and climbs back up it if it falls;
  legs straightened by a fast rise in blood pressure (hydraulics) rather than extensor muscles; https://en.wikipedia.org/wiki/Jumping_spider'
