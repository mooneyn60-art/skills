tt:
  - xray: Its bite is painless, so you just keep sleeping.
  - fact: The babies need a full blood meal before every single growth stage.
  - count: Five stages. Five meals. All of them, you.
    with: [bed_bug, bed_bug, bed_bug]
  - solo: A female lays eggs every day. Hundreds in her life. Each one the size of a dust speck.
    scene: fibers
  - fact: Now the gross part. The male doesn't mate the normal way.
  - escalate: He stabs straight through her body, and injects his sperm inside.
  - fact: Scientists actually call it traumatic insemination.
  - calm: And starving them out doesn't work. In a cool room, they can wait about a year without eating.
  - fact: The good news? They're not known to spread disease. Just itchy bites.
  - solo: They ride home in luggage and folded clothes.
    scene: bedroom
    scene_p: {time: day}
  - fact: Would you check your mattress tonight?
  - punch: Sleep tight. Something in there is counting on it.
