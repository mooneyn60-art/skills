sources:
- 'Utah State University Extension, Booklice fact sheet (Utah Pests): booklice are flat, pale, soft-bodied, 1-4 mm long; do
  not feed on bindings or glue but on mold and other fungi present in books; also occur in rugs, stored grains, damp construction
  materials; many but not all species reproduce parthenogenetically, all females that do not require fertilization by males;
  life cycle 4 weeks to 2 months, a single generation in as few as 25 days under ideal conditions; do not bite or transmit
  disease; control by decreasing humidity and increasing airflow; https://extension.usu.edu/pests/uppdl/files/factsheet/booklice.pdf'
- 'Utah State University Extension IPM, Booklice and Psocids: indoors found in damp books, around leaking or sweating pipes,
  in voids and cardboard boxes; eat mold spores; indicator of moisture issues; https://extension.usu.edu/planthealth/ipm/notes_nuisance/booklice-psocids'
- 'Clemson Cooperative Extension HGIC, Booklice: not true lice, related to barklice; do not bite people or pets; feed on mold,
  and starchy foods like flour, grains and dried fruit; damage damp books by feeding on moldy paper; ideal 75-90% relative
  humidity; 50-60% is harmful and they can die within weeks if humidity stays low; keep humidity below 50%; large populations
  build up in newly built structures because fresh plaster and drywall hold moisture that supports mold; https://hgic.clemson.edu/factsheet/booklice/'
