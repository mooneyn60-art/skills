# Things Living In Your House #35 (realistic look, E29 style test).
slug: stink-bug-asia
series: Things Living In Your House
part: 35
title: This Bug Came From Asia to Spend Winter in Your House (Things Living In Your House #35)
next: 'Next: the wasp that walks a cockroach home.'
sources:
- 'Penn State Extension, Brown Marmorated Stink Bug: accidentally introduced from east Asia (China, Japan, Korea); first collected in Allentown, PA in 1998; adults approximately 17 mm (0.66 in) long; in fall adults seek the outside of houses and can enter houses in large numbers; will not reproduce inside structures or cause damage; if many are crushed or sucked into a vacuum cleaner their smell can be quite apparent; https://extension.psu.edu/brown-marmorated-stink-bug'
yt:
- hook: This bug came from Asia, and it wants your house.
- tiny: It's only about two-thirds of an inch long.
- count: In fall, they can enter houses in large numbers.
- calm: Good news, they won't breed inside.
- punch: But never vacuum them. The vacuum will stink.
