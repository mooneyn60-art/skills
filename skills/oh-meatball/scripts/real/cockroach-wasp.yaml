# Things Living In Your House #36 (realistic look, E29 style test). Cockroach, new angle (drawn #8 was the roach itself).
slug: cockroach-wasp
series: Things Living In Your House
part: 36
title: This Wasp Walks a Cockroach to Its Doom (Things Living In Your House #36)
next: 'Next: the spider as big as a dinner plate.'
sources:
- 'Gal, Kaiser, Haspel & Libersat 2014, Sensory Arsenal on the Stinger of the Parasitoid Jewel Wasp and Its Possible Role in Identifying Cockroach Brains, PLoS ONE 9(2): e89683 (Ben-Gurion University): the jewel wasp (Ampulex compressa) stings a cockroach twice, first in the thorax and then in the head, injecting venom directly inside its brain; it walks the "zombie" cockroach into a nest, lays an egg on its leg, and the larva feeds on the live cockroach; https://pmc.ncbi.nlm.nih.gov/articles/PMC3935893'
- 'Footage note: the clip shows an Ampulex wasp (genus of the jewel wasp) dragging a cockroach, Wayanad, India (CC0, Shyamal).'
yt:
- hook: This wasp is walking a cockroach to its doom.
- xray: Jewel wasps like her sting the roach in the brain.
- chase: Then it stops fighting and follows her home.
- count: She lays one egg on its leg.
- punch: Then her baby eats the roach. Alive.
