sources:
- 'University of Colorado Boulder, CU-Boulder space-traveling spider finds home in Smithsonian museum (29 Nov 2012): a jumping spider named Nefertiti returned to Earth after 100 days in space; habitat held the arachnid and its food, fruit flies; Nefertiti was able to adjust her feeding behavior to account for microgravity and still catch her prey; new home the Smithsonian National Museum of Natural History Insect Zoo; https://www.colorado.edu/today/2012/11/29/cu-boulder-space-traveling-spider-finds-home-smithsonian-museum'
