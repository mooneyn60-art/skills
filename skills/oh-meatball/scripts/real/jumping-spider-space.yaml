- 'UF/IFAS Featured Creatures EENY-152 (G. B. Edwards), Regal jumping spider: jumping spiders are harmless, beneficial creatures; the larger species can deliver a painful bite but only if held tightly; https://edis.ifas.ufl.edu/publication/IN309'
yt:
- hook: A spider like this flew to space and kept hunting.
