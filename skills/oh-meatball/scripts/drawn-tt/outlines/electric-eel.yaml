sources:
- 'de Santana et al. 2019, Nature Communications, Unexpected species diversity in
  electric eels: Electrophorus voltai discharged up to 860 volts, the strongest bioelectric
  discharge known; electric eels are knifefishes, not true eels; https://doi.org/10.1038/s41467-019-11690-z'
- 'Smithsonian''s National Zoo / Smithsonian Magazine (2019): electric eels live in
  the Amazon and Orinoco basins, grow up to about 8 feet, breathe air and must surface
  to gulp it, getting most of their oxygen from the air; electric organs fill most
  of the body; weak electric pulses help them sense their surroundings in murky water;
  https://nationalzoo.si.edu/animals/electric-eel'
- 'Catania 2014, Science, The shocking predatory strike of the electric eel: high-voltage
  pulses make hidden prey twitch, revealing it; Catania 2016, PNAS, Leaping eels electrify
  threats: eels leap out of the water and press their chin against a threat to deliver
  shocks; https://doi.org/10.1073/pnas.1604009113'
- 'Bastos et al. 2021, Ecology and Evolution, Social predation in electric eels: groups
  of Electrophorus voltai herd small fish and strike together; https://doi.org/10.1002/ece3.7121'
