sources:
  - "Park et al. 2017, Science, Fructose-driven glycolysis supports anoxia resistance in the naked mole-rat: naked mole-rats survived 18 minutes of total oxygen deprivation without apparent injury, switching to fructose-based metabolism; https://doi.org/10.1126/science.aab3896"
  - "Smithsonian's National Zoo, Naked mole-rat: lives underground in East Africa (Kenya, Ethiopia, Somalia); colonies are led by a single breeding queen, like bees and ants; nearly blind, small eyes; lips close behind the front teeth so they can dig with their teeth without getting dirt in their mouths; can live more than 30 years; huddle together to keep warm; https://nationalzoo.si.edu/animals/naked-mole-rat"
  - "Buffenstein lab / Ruby et al. 2018, eLife: naked mole-rat mortality does not rise with age, lifespans past 30 years; cancer is extremely rare in the species (only a handful of cases ever reported); https://doi.org/10.7554/eLife.31157"
  - "Park et al. 2008, PLoS Biology, Selective inflammatory pain insensitivity in the African naked mole-rat: their skin does not respond with pain to acid or capsaicin; https://doi.org/10.1371/journal.pbio.0060013"
