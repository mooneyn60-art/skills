sources:
  - "Smithsonian's National Zoo / Migratory Bird Center, Hummingbird facts: hummingbirds are the only birds that can fly backwards (in sustained flight) and hover; heart rates as high as about 1,260 beats per minute in the blue-throated hummingbird; the ruby-throated hummingbird beats its wings about 50 times per second and many fly nonstop across the Gulf of Mexico (about 500 miles) on migration; at night they can enter torpor, dropping body temperature and heart rate to save energy; https://nationalzoo.si.edu/migratory-birds/news/hummingbird-facts"
  - "Encyclopaedia Britannica, Bee hummingbird: the smallest living bird, about 5-6 cm long and around 2 g, found in Cuba; https://www.britannica.com/animal/bee-hummingbird"
