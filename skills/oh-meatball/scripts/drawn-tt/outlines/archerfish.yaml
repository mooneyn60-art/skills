  - xray: How? It presses its tongue into a groove in its mouth. A water gun barrel.
  - calm: The bug never sees it coming.
tt:
  - fact: It can hit prey more than ten times its own body length away.
  - fact: An adult can fire up to seven shots in a row.
    act: {talk: 1.0}
  - solo: And here's the hard part. Its eyes are underwater. The bug is in the air.
  - fact: Light bends at the surface. Young fish learn to adjust their aim for that.
  - solo: It even spits at the mud, to blast buried food loose.
    act: {talk: 1.0}
  - fact: Then scientists showed archerfish pictures of human faces.
  - escalate: They trained them to spit at one face, and they picked it out from up to forty four strangers.
  - fact: The best scores? About eight times out of ten.
  - solo: Would you let one spit in your face?
    act: {mood: smug}
  - punch: A fish with a water gun, and it remembers your face.
