sources:
- 'History Hit, ''Flannan Isle Mystery: When Three Lighthouse Keepers Vanished Forever'':
  keepers James Ducat, Thomas Marshall and Donald McArthur made their last slate entries
  on 15 December 1900; the steamer Archtor saw the light was not lit; the relief vessel
  Hesperus could not land on 20 December and arrived about midday on 26 December;
  Captain Harvie sounded the horn and fired a flare with no reply; relief keeper Joseph
  Moore went ashore alone, found the gate and main door closed and the clock stopped;
  a set of oilskins left behind suggested one keeper went out without them; superintendent
  Robert Muirhead concluded the men were swept away by the storm at the west landing;
  no trace was ever found; reported log entries about crying and praying were found
  never to have been made and were likely falsified; https://www.historyhit.com/the-flannan-isle-mystery-when-three-lighthouse-keepers-vanished-overnight/'
- 'Scotia (Brooklyn College, CUNY), John May, ''The Flannan Isle Lighthouse'', quoting
  Muirhead''s report of 8 January 1901: a box of mooring ropes secured in a crevice
  about 110 feet above sea level was gone, iron railings displaced and twisted; Muirhead
  concluded ''an unexpectedly large roller had come up on the island'' and swept the
  men away; Gibson''s poem was ''not historically accurate''; https://userhome.brooklyn.cuny.edu/anthro/jbeatty/Scotia/issue38/issue38a.html'
- 'Skeptoid #610 (Brian Dunning, citing historian Mike Dash): the half-eaten meal
  and knocked-over chair come from W. W. Gibson''s 1912 poem; Moore''s report describes
  a normal interior; the dramatic log entries first appeared in print in 1965, traced
  to 1929 fiction; the real logbook''s last entry was the 13th; two oilskins were
  missing and storm damage was found at the west landing; https://skeptoid.com/episodes/610'
