sources:
  - "North Carolina Wildlife Resources Commission, Virginia Opossum species profile: when cornered they hiss and drool as a threat display; will feign death while defecating and emitting a foul-smelling greenish substance from its anal glands; 50 teeth, more than any other North American mammal; young weigh 0.13 grams at birth; highly resistant to rabies; resistant to the venom of common venomous snakes; prehensile, nearly hairless tail; https://www.ncwildlife.gov/species/virginia-opossum"
  - "National Park Service, Virginia Opossum: may fall into a catatonic state when too stressed, 'playing possum' is an involuntary reaction; 50 teeth, more than any North American land mammal; https://www.nps.gov/cwdw/learn/nature/virginia-opossum.htm"
  - "The Nature Conservancy, Cool Green Science, 'Strange and Surprising Facts about Opossums' (2021): remains in the death-feigning state for minutes to hours; emits a foul substance from its anus with a corpse-like smell; teeth visible as in a death grimace; newborns about the size of a honeybee; a litter may be 25 young but females have only 13 nipples, a baby that doesn't fasten to a nipple dies; resistant to most snake venom including rattlesnake and copperhead; rarely contracts rabies; https://blog.nature.org/2021/05/11/strange-and-surprising-facts-about-opossums"
  - "Maryland Department of Natural Resources, Opossum: the only marsupial (pouched mammal) native to North America; fakes illness by drooling, which can deter predators since many avoid sick prey; cannot hang upside down by its tail but uses it to climb; exactly 50 teeth; babies the size of a honeybee at birth, nurse in the pouch for two months; mother often carries young on her back; https://dnr.maryland.gov/wildlife/Pages/plants_wildlife/opossum.aspx"
yt:
  - hook: When it's scared, this animal fakes its own death. And makes itself smell like a corpse.
  - name: The Virginia opossum. North America's only pouched mammal.
  - solo: Corner one at night, and first, it hisses and drools.
    zoom: 1.05
  - fact: Then it drops. Mouth open. Teeth showing, like a death grin.
  - escalate: And it leaks a green goo from its rear end that smells like a rotting body.
  - calm: It can lie there for minutes. Or for hours.
tt:
  - fact: Here's the weird part. It isn't acting.
  - xray: It's an automatic reaction. It doesn't choose to do it.
  - fact: Many hunters avoid prey that looks sick. And this looks very sick.
  - count: And look at that grin. Fifty teeth. More than any other land mammal in North America.
  - solo: Its tail grabs branches as it climbs.
    zoom: 1.05
  - fact: But no, it can't hang upside down by its tail. That's a cartoon.
  - scale: Its babies are born the size of a honeybee.
    how: shrink
  - escalate: A mom can have up to twenty-five babies. But she only has thirteen nipples.
  - fact: The babies that don't grab one, don't survive.
  - fact: It shrugs off the venom of most snakes, like rattlesnakes and copperheads.
  - fact: And it almost never gets rabies.
  - fact: So if you find one lying still and stinking, would you poke it?
  - punch: The best way to win a fight? Drop dead, and stink.
