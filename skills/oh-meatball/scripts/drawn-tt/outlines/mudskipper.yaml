sources:
- 'EarthDate (Bureau of Economic Geology, University of Texas at Austin), Fish Out
  of Water: some mudskippers spend three-quarters of their lives on land; take in
  oxygen through skin, mouth and throat as long as they are wet; muscular pectoral
  fins move them across mud; eyes adapted for aerial vision and can''t focus when
  submerged; eyes rotate independently to spot prey; blink by pulling the eyes into
  the head; at high tide live in burrows in the mud; burrows hold eggs and an air
  pocket; https://www.earthdate.org/episodes/fish-out-of-water'
- 'National Geographic magazine (2020), Mudskipper builds ideal nest for his offspring:
  males flare fins and leap high to court; an impressed female follows him to the
  burrow; eggs laid on the chamber ceiling; the male gulps air, carries it down and
  exhales it, roughly 100 mouthfuls to make the air bubble (Karen Martin); he times
  the air release so water floods in and the larvae hatch; https://www.nationalgeographic.com/magazine/article/mudskipper-builds-ideal-nest-for-his-offspring'
- 'BBC Wildlife (Discover Wildlife), Fish that can walk on land evolved the ability
  to blink like we do (Aiello, Stewart et al., PNAS 2023): mudskippers blink by pulling
  their eyeballs back into their skulls; https://discoverwildlife.com/news/fish-that-can-walk-on-land-evolved-the-ability-to-blink-like-we-do'
