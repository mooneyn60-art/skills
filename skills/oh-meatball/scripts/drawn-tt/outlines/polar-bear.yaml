sources:
- 'Polar Bears International, Polar bear facts: polar bear hair is not white but transparent,
  pigment-free, and scatters light so the bear looks white; the skin underneath is
  black; front paws up to 12 inches (30 cm) across, used as paddles; small bumps (papillae)
  on the paw pads grip the ice; adult males can weigh over 1,000 lb; mainly eat ringed
  and bearded seals; cubs are born in snow dens in winter weighing a little over a
  pound; denning mothers can go up to about eight months without eating; https://polarbearsinternational.org/polar-bears-changing-arctic/polar-bear-facts/'
- 'Pagano et al. 2012, Polar Biology, Long-distance swimming by polar bears in the
  southern Beaufort Sea: a GPS-collared female swam 687 km continuously over about
  9 days; https://doi.org/10.1007/s00300-012-1215-5'
- 'NOAA Fisheries / US Marine Mammal Protection Act: polar bears are classified as
  marine mammals; https://www.fws.gov/species/polar-bear-ursus-maritimus'
