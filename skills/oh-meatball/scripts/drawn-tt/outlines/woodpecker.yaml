- 'Smithsonian Magazine (2022), Woodpeckers Don''t Have Shock-Absorbing Skulls, on
  Van Wassenbergh et al., Current Biology: woodpeckers drill about 12 thousand times
  a day; high-speed video of black, pileated and great spotted woodpeckers showed
  the head acts as a stiff hammer rather than a shock absorber; protection comes mainly
  from small size, the brain roughly 700 times smaller than a human''s, and they would
  need to strike about twice as fast to risk concussion; https://www.smithsonianmag.com/smart-news/woodpecker-skulls-dont-absorb-shock-like-previously-thought-180980426/'
- 'National Park Service, Pinnacles National Park, Woodpeckers: tongues so long they
  wrap around the skull when not in use; barbs on the tongue tips hold insect prey;
  stiff tails for balancing on trunks; acorn woodpeckers store up to 50,000 acorns
  in a single granary tree; https://www.nps.gov/pinn/learn/nature/woodpeckers.htm'
