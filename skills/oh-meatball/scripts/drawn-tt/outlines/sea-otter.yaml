sources:
- 'Monterey Bay Aquarium, Sea otter: the densest fur of any animal, up to about a
  million hairs per square inch; no blubber, they stay warm with fur and trapped air
  and must groom constantly; they eat about a quarter of their body weight a day;
  they use rocks as tools to crack open shellfish while floating on their backs; a
  loose pouch of skin under each forearm stores food and a favourite rock; they wrap
  themselves in kelp to keep from drifting while they sleep, and groups resting together
  are called rafts; mothers carry pups on their chests and pups'' fluffy fur keeps
  them afloat; https://www.montereybayaquarium.org/animals/animals-a-to-z/sea-otter'
- 'US Fish & Wildlife Service / NOAA, Southern sea otter: a keystone species, eating
  sea urchins that would otherwise overgraze kelp forests; https://www.fws.gov/species/southern-sea-otter-enhydra-lutris-nereis'
