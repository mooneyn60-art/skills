sources:
  - "Nielsen et al. 2016, Science, Eye lens radiocarbon reveals centuries of longevity in the Greenland shark: lifespan of at least 272 years, the largest shark (502 cm) estimated at 392 +/- 120 years; the longest-lived vertebrate known; sexual maturity reached at about 150 years; growth of roughly 1 cm per year; https://doi.org/10.1126/science.aaf1703"
  - "Watanabe et al. 2012, Journal of Experimental Marine Biology and Ecology, The slowest fish: Greenland sharks cruise at about 0.34 m/s (0.76 mph), the slowest swim speed measured in fish relative to size; https://doi.org/10.1016/j.jembe.2012.06.004"
  - "NOAA Ocean Exploration / Smithsonian Ocean, Greenland shark: lives in the cold North Atlantic and Arctic, down to about 2,200 m; often carries a parasitic copepod hanging from its eye; its flesh is toxic when fresh because of trimethylamine oxide, and in Iceland it is fermented and dried to make hakarl; stomach contents have included seals and even remains of polar bears and reindeer, likely scavenged; https://ocean.si.edu/ocean-life/sharks-rays/greenland-shark"
