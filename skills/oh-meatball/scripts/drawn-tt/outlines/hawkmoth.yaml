sources:
- 'bioGraphic (science magazine), ''Snake Fake'' (M. Pobis, photos M. Bowler, 2019): the sphinx hawk moth caterpillar Hemeroplanes
  triptolemus, photographed in Peru, is a snake mimic; when threatened it pulls air in through tiny holes in its surface and
  inflates its head into a triangular viper-like shape; its underside is patterned in faux snakeskin with eyespots that appear
  to glisten; if that fails it lunges as if to strike; it has no venom or actual weaponry; birds and lizards hunt it; experiments
  with artificial pastry-dough caterpillars found eyespots and a snake-shaped head improved survival against birds; sphinx
  moth caterpillars become fluffy moths; https://www.biographic.com/snake-fake/'
- 'Skelhorn J., Dorrington G., Hossie T.J., Sherratt T.N. (2014) ''The position of eyespots and thickened segments influence
  their protective value to caterpillars'', Behavioral Ecology 25(6):1417-1422: naive chicks were most wary of artificial
  caterpillars with eyespots or a thickened section at the front end (like a head); the traits deter predators by making caterpillars
  resemble dangerous vertebrates, not just by being conspicuous; https://ideas.repec.org/a/oup/beheco/v25y2014i6p1417-1422..html'
- 'Area de Conservacion Guanacaste caterpillar database (D. H. Janzen and W. Hallwachs, University of Pennsylvania), voucher
  91-SRNP-1284: Hemeroplanes triptolemus (Sphingidae) reared in Costa Rica, food plant Mandevilla subsagittata (Apocynaceae);
  https://junquillal.info/voucher/91-SRNP-1284'
