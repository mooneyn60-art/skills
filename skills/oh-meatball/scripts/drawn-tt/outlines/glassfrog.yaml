sources:
- 'Duke University Pratt School of Engineering news (2022), Glassfrogs Hide Red Blood
  Cells in Their Liver to Become Transparent (Taboada, Delia, Yao et al., Science,
  Dec 2022): northern glassfrog no more than a few centimeters; rests by day hanging
  upside down under leaves; while asleep removes nearly 90 percent of circulating
  red blood cells into a mirror-coated liver; avoids a huge blood clot; cells flow
  back when active; https://pratt.duke.edu/news/glassfrogs-hide-red-blood-cells-their-liver-become-transparent/'
- 'Sci.News, Study: Glassfrogs Hide Red Blood Cells in Their Liver to Achieve Transparency
  (reporting the Science paper): resting glassfrogs increase transparency two- to
  threefold; liver contains reflective guanine crystals; could inform biomedical research
  on clotting; https://www.sci.news/biology/glassfrog-transparency-11520.html'
- 'National Geographic magazine, These see-through frogs are full of surprises: male
  sun glass frog''s heart beats visibly through its chest; a female''s eggs visible
  through her stomach; some species smaller than a paper clip; 156 known species mainly
  in the northern Andes and Central America; males of at least 24 species care for
  eggs, sitting on them to keep them hydrated; the father sucks water up into his
  urinary bladder through a highly vascularized region of the belly; tadpoles fall
  into the stream below; https://www.nationalgeographic.com/magazine/article/these-see-through-frogs-are-full-of-surprises-feature'
