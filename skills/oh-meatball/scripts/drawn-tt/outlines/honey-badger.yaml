sources:
- 'San Diego Zoo Wildlife Alliance, Honey badger (ratel): found across Africa, the
  Middle East and India; thick, loose skin lets it twist around to bite an attacker
  that grabs it, and protects against bee stings, porcupine quills and bites; eats
  almost anything, including bee larvae and honey, rodents, snakes, scorpions, roots
  and berries; strong claws for digging burrows; anal pouch releases a strong-smelling
  secretion; https://animals.sandiegozoo.org/animals/honey-badger'
- 'Drabeck, Dean & Jansa 2015, Toxicon, Why the honey badger don''t care: convergent
  evolution of venom-targeted nicotinic acetylcholine receptors in mammals that survive
  venomous snake bites: honey badgers carry receptor mutations that resist snake alpha-neurotoxins;
  https://doi.org/10.1016/j.toxicon.2015.01.004'
- 'BBC, Honey Badgers: Masters of Mayhem (2014): Stoffel, a honey badger at a South
  African rehabilitation centre, repeatedly escaped enclosures, stacking objects and
  opening gates; https://www.bbc.co.uk/programmes/b04nrjvy'
