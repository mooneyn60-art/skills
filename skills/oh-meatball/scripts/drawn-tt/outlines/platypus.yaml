sources:
- 'Australian Museum, Platypus: found in eastern Australia; one of only five living
  egg-laying mammals (monotremes); males have a venomous spur on each hind ankle,
  the venom causes severe pain but is not known to kill people; the bill is packed
  with electroreceptors and touch receptors, and it hunts underwater with eyes, ears
  and nostrils closed; adults have no teeth and grind food with horny pads; mothers
  have no nipples, milk seeps from patches on the belly; https://australian.museum/learn/animals/mammals/platypus/'
- 'Anich et al. 2020, Mammalia, Biofluorescence in the platypus: platypus fur glows
  blue-green under ultraviolet light; https://doi.org/10.1515/mammalia-2020-0027'
- 'Ordoñez et al. 2008, Genome Research / University of Sydney: the platypus lacks
  a true stomach; the gullet connects straight to the intestine; https://doi.org/10.1101/gr.7096208'
- 'Natural History Museum (London), The platypus specimen: when the first platypus
  specimen reached Britain (described by George Shaw, 1799), naturalists suspected
  it might be a fake stitched together from different animals; https://www.nhm.ac.uk/discover/platypus.html'
