- fact: Its eyesight is bad. But it can smell you, and hear you, just fine.
- fact: It rolls around in the dirt, to scare off biting flies and rub off old fur.
- fact: Once, tens of millions may have roamed. By nineteen oh two, Yellowstone had about two dozen left.
- solo: Now it's the national mammal of the United States.
  hero_at:
