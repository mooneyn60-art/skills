sources:
- 'National Park Service, Yellowstone, Safety in the Park: bison ''have injured more people in Yellowstone than any other
  animal''; can run 3x faster than humans; keep at least 25 yards (23 m) away; warning signs include bluff charging, head
  bobbing, pawing, bellowing or raising its tail; https://www.nps.gov/yell/planyourvisit/safety.htm'
- 'National Park Service, Yellowstone, Bison: largest land mammal in North America; bulls up to 2,000 lb; can run 35 mph;
  can clear obstacles about 5 ft high; the hump is large muscles on long vertebrae, used to swing the head like a snowplow;
  wallowing deters biting flies, removes molted fur and leaves scent, bulls wallow in the rut to show strength; 30-60 million
  bison before the mid-1800s, Yellowstone herd fell to about two dozen by 1902; https://www.nps.gov/yell/learn/nature/bison.htm'
- 'U.S. Department of the Interior, 15 Facts About Our National Mammal: the American Bison: national mammal since May 9, 2016;
  bulls about 2,000 lb and 6 ft tall; run up to 35 mph, spin quickly, jump high fences; tail hanging down and swishing usually
  means calm, tail straight up can signal a charge; poor eyesight, excellent smell and hearing; calves born orange-red (''red
  dogs''); https://www.doi.gov/blog/15-facts-about-our-national-mammal-american-bison'
yt:
- hook: The animal that hurts the most people in Yellowstone isn't a bear. It's this.
- name: The American bison. The biggest land animal in North America.
- fact: A bull can weigh two thousand pounds, and stand six feet tall.
- solo: It looks slow and sleepy, munching grass all day.
  hero_at:
    x: 600
- escalate: But it can run thirty five miles an hour. Three times faster than you.
- calm: It just stands there, chewing. Until it doesn't.
tt:
- fact: So watch the tail. Hanging down and swishing usually means it's calm.
- escalate: Tail sticking straight up? It may be about to charge.
- fact: It can spin on the spot, and jump over a five foot fence.
- fact: That giant hump isn't fat. It's a wall of muscle.
- solo: In winter, it swings its huge head like a snowplow, to dig grass out of the snow.
