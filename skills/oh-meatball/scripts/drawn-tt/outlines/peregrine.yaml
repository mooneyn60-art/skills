tt:
  - solo: At that speed, how does it even breathe? Tiny bumps in its nostrils slow the rushing air.
    hero_at: {x: 515}
  - solo: And a see-through third eyelid slides over each eye, like built in goggles.
    hero_at: {x: 515}
    act: {mood: calm}
  - solo: Fifty years ago, it almost vanished. The bug spray DDT poisoned it.
    hero_at: {x: 515}
    scene: swamp
    scene_p: {time: dusk}
    act: {mood: worry}
  - solo: Its eggshells got so thin, they cracked under the parents.
    hero_at: {x: 515}
    scene: swamp
    scene_p: {time: dusk}
    act: {mood: worry}
  - solo: By nineteen seventy five, North America was down to three hundred twenty four pairs.
    hero_at: {x: 515}
    scene: swamp
    scene_p: {time: night}
    act: {mood: worry}
  - solo: Then it came back. And it moved to the city.
