sources:
- 'Smithsonian''s National Zoo, Komodo dragon: wild adults about 154 lb; largest verified 10.3 ft and 366 lb; venom gland
  in the lower jaw, venom prevents clotting, causing massive blood loss and shock; can eat up to 80% of its body weight in
  one meal; smell is its main food detector, sampled with a forked tongue; runs briefly 10-13 mph but hunts by stealth and
  power; only on a few Indonesian islands (Komodo, Rintja, Padar, Flores); https://nationalzoo.si.edu/animals/komodo-dragon'
- 'Fry et al. 2009, PNAS 106(22): 8969-8974: Komodo skull poorly adapted to high bite force but resists pulling loads; rejects
  the toxic-bacteria idea; venom causes anticoagulation and shock; https://doi.org/10.1073/pnas.0810883106'
- 'Watts et al. 2006, Nature 444: 1021-1022, Parthenogenesis in Komodo dragons: genetic fingerprinting showed offspring of
  two zoo females kept away from males had no father; https://doi.org/10.1038/4441021a'
