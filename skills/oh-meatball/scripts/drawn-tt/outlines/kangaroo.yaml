  - calm: But when it grazes, it walks slowly, on five legs.
tt:
  - fact: The fifth leg is its tail. It pushes as hard as the front and back legs combined.
  - fact: Now the babies. A newborn joey is the size of a jellybean.
  - fact: It climbs straight into mom's pouch, all by itself.
  - escalate: And mom can already be pregnant again, with the next baby on pause.
  - fact: That baby waits, until the joey leaves the pouch. Then it's born.
  - fact: She can feed a joey in the pouch, and a bigger one outside, with two different kinds of milk.
  - solo: Males fight by leaning back on their tails, and boxing with their back legs.
    act: {mood: angry}
  - fact: And in the heat, it licks its arms, and covers them in spit.
    act: {talk: 1.0}
  - escalate: As the spit dries, it cools the blood underneath.
  - solo: Would you get in the ring with one?
    act: {mood: angry}
  - punch: It pauses babies, makes two kinds of milk, and cools off with its own spit.
