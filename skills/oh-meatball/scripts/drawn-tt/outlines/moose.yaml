sources:
- 'Alaska Department of Fish and Game, Alaska Fish & Wildlife News (Jan 2020): more
  people are injured in Alaska by moose than by bears; moose can deliver dangerous
  blows with their hooves when threatened; https://www.adfg.alaska.gov/index.cfm?adfg=wildlifenews.view_article&articles_id=939'
- 'National Wildlife Federation, Moose: largest deer, about six feet tall at the shoulder;
  excellent swimmers that can hold their breath underwater for 30 seconds; can run
  over 35 mph; antlers up to six feet across; females protect calves with kicks that
  can break bones; https://www.nwf.org/Educational-Resources/Wildlife-Guide/Mammals/Moose'
- 'National Park Service, Moose: Did You Know?: largest bull at the Kenai Moose Research
  Station weighed 1,697 lb; mature moose grow about an inch of antler a day; antlers
  up to 75 lb; tested down to -22 F without feeling cold; https://www.nps.gov/articles/moose-did-you-know.htm'
- 'National Park Service, Isle Royale: Moose: in summer moose feed in lakes and beaver
  ponds on aquatic plants that grow beneath the surface; https://www.nps.gov/isro/learn/nature/moose.htm'
- 'National Park Service, Yellowstone: Moose: bulls shed antlers in winter and grow
  new ones each spring; https://www.nps.gov/yell/learn/nature/moose.htm'
- 'North Dakota Game and Fish, Winter Ticks and Moose: in good tick years 75,000 to
  150,000 winter ticks on a single moose; infested moose rub off much of their hair,
  looking grey (''ghost moose''); https://gf.nd.gov/wildlife-notes/winter-ticks-and-moose'
