sources:
- 'Animal Diversity Web (University of Michigan Museum of Zoology), Balaeniceps rex
  (shoebill): stands 110 to 140 cm tall; bill resembles a wooden shoe and ends in
  a sharp curved hook; inhabits freshwater swamps and dense marshes, endemic to east-central
  Africa; eats mainly fish such as lungfish, bichirs, catfish and tilapia, plus watersnakes,
  occasionally frogs, monitor lizards, turtles, young crocodiles; hunts by ''stand
  and wait'' or wading slowly; the ''collapse'': head and neck stretch forward into
  the water so the bird over-balances and collapses forwards and downwards; prey is
  usually decapitated before swallowing; usually silent but bill-clatters, most often
  when greeting at the nest; lays one to three, normally two eggs; adults pour mouthfuls
  of water over the nest to keep eggs cool; usually only one chick remains by the
  end of the breeding cycle; https://animaldiversity.org/accounts/Balaeniceps_rex/'
