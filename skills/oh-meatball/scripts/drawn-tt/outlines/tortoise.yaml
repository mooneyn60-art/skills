sources:
  - "Galapagos Conservancy, Giant Tortoises: can survive without food or water for up to a year; pirates, whalers and fur sealers stored live giant tortoises in ship holds as fresh meat; tortoise oil lit the lamps of Quito; 100,000 to 200,000 tortoises lost; eat cactus pads, grasses and fruit; store large amounts of water in their bladders; 20,000-25,000 wild today; 'Galapagos' from the old Spanish word for saddle; finches dance in front of tortoises to ask to eat ticks and the tortoise stretches its neck; https://www.galapagos.org/about_galapagos/about-galapagos/biodiversity/tortoises/"
  - "Smithsonian's National Zoo, Aldabra Tortoise: males up to 550 lb (250 kg); live more than 100 years; sleep about 18 hours a day; may eat dead tortoises or feces; wallow in mud against mosquitoes; https://nationalzoo.si.edu/animals/aldabra-tortoise"
  - "Linda Hall Library, Voyages of the Beagle (Darwin's Voyage, Galapagos excerpt): Darwin got on the tortoises' backs, rapped their shells to make them walk, and found it very difficult to keep his balance; https://voyages.lindahall.org/darwin3.shtml"
