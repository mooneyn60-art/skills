tt:
  - fact: Pirates, whalers, and seal hunters all did it.
    hero_at: {x: 760}
  - fact: As many as two hundred thousand tortoises were lost.
    hero_at: {x: 760}
  - fact: Their oil was even burned to light lamps in the city of Quito.
    hero_at: {x: 760}
  - fact: Today, only about twenty thousand roam the Galapagos.
    hero_at: {x: 760}
  - fact: The islands are named after them. Galapago meant saddle, like their shell.
    hero_at: {x: 760}
  - scale: Charles Darwin climbed onto their backs, and rode them.
    how: shrink
  - fact: He said keeping his balance was very hard.
    hero_at: {x: 760}
  - fact: It sleeps about eighteen hours a day.
    hero_at: {x: 760}
