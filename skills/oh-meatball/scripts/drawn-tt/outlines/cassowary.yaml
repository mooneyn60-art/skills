sources:
  - "Queensland Government, Department of Environment, Southern cassowary: lives in tropical rainforest in north Queensland (also New Guinea); can run up to 50 km/h; good swimmers; the inner toe of each foot carries a long dagger-like claw; males incubate the bright green eggs for about 50 days and raise the striped chicks for about nine months; disperses the seeds of many rainforest plants; most attacks on people happen after cassowaries have been fed; https://environment.desi.qld.gov.au/wildlife/animals/living-with/cassowaries"
  - "San Diego Zoo Wildlife Alliance, Cassowary: inner claw up to about 4 inches (10 cm) long; casque on the head; one of the heaviest birds, after ostriches; https://animals.sandiegozoo.org/animals/cassowary"
  - "Natural History Museum (London), Birds are dinosaurs: modern birds are living theropod dinosaurs; https://www.nhm.ac.uk/discover/how-dinosaurs-evolved-into-birds.html"
