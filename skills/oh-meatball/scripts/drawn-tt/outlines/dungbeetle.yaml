sources:
- 'National Geographic (2013), Dung beetles navigate by the Milky Way (Dacke et al., Current Biology, Lund University and
  University of Pretoria): first animal known to navigate using the Milky Way; beetles fitted with little cardboard hats that
  blocked the sky rolled aimlessly; in the Johannesburg Planetarium they oriented as well under the Milky Way alone as under
  a full starry sky; they must leave the dung pile quickly in a straight line or thieves steal the ball; buried dung balls
  become food for their young; https://www.nationalgeographic.com/animals/article/dung-beetles-milky-way-navigation'
- 'ScienceDaily (2012), Smolka et al., Dung beetles use their dung ball as a mobile thermal refuge, Current Biology 22(20):
  balls weigh up to 50 times the beetle''s body weight; beetles climb on the moist ball when their front legs and head overheat
  on hot sand, seven times as often on hot soil; silicone boots on the front legs made them climb less; on the ball they often
  wipe their faces, which researchers suspect spreads regurgitated liquid to cool them; https://www.sciencedaily.com/releases/2012/10/121022122054.htm'
- 'ScienceDaily (2010), Queen Mary University of London press release on Knell and Simmons, Proceedings of the Royal Society
  B: the dung beetle Onthophagus taurus can pull 1,141 times its own body weight; https://www.sciencedaily.com/releases/2010/03/100323212158.htm'
