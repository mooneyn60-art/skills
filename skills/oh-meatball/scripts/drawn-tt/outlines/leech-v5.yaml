sources:
- 'U.S. FDA 510(k) K040187, Medicinal Leeches (Ricarimpex), cleared June 2004: Hirudo medicinalis cleared as a medical device, an adjunct to graft healing when venous congestion threatens the tissue; https://www.accessdata.fda.gov/cdrh_docs/pdf4/K040187.pdf'
- 'Kumar et al. / Journal of Ayurveda and Integrative Medicine (2019 review, PMC7772495), Leech therapy: saliva has more than 100 bioactive substances, is anesthetic so the host does not notice the bite,
