sources:
- 'Yang et al. 2021, Soft Matter, Intestines of non-uniform stiffness mold the corners
  of wombat feces: bare-nosed wombats produce cube-shaped faeces, about 80-100 cubes
  per night, shaped in the last part of the intestine by stiff and soft regions of
  the intestinal wall; the earlier work won a 2019 Ig Nobel Prize in Physics; https://doi.org/10.1039/D0SM01230K'
- 'Australian Museum, Common (bare-nosed) wombat: nocturnal burrowing marsupial of
  south-eastern Australia; the pouch opens backwards so soil doesn''t get in when
  digging; teeth grow continuously; deposits scats on rocks and logs as territory
  markers; https://australian.museum/learn/animals/mammals/common-wombat/'
- 'Australian Geographic / Wombat Protection Society: wombats can run at up to about
  40 km/h; the rump is reinforced with a tough cartilage plate used to block the burrow
  entrance against predators; https://www.australiangeographic.com.au/topics/wildlife/2016/02/wombat-facts/'
