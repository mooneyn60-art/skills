sources:
- 'National Geographic, Blue-footed booby: the Galapagos population includes about half of all breeding pairs; dives into
  the water from as high as 80 feet; males show off their feet with a high-stepping walk, the bluer the feet the more attractive
  the mate; the name is thought to come from the Spanish ''bobo'', meaning stupid, as the birds looked clumsy on land; eats
  small fish such as anchovies; https://www.nationalgeographic.com/animals/birds/facts/blue-footed-booby'
- 'PBS Nature, Blue-Footed Booby: feet coloured by carotenoids from its fish diet, more intense blue linked to greater mating
  success; plunges from about 30 m and swims as deep as about 25 m (80 ft); a specialized air sac protects it from impact
  and pressure; permanently closed nostrils; 2-3 eggs incubated by both parents using their warm, blood-vessel-rich feet;
  https://www.pbs.org/wnet/nature/group/birds/blue-footed-booby-birds'
- 'Bizberg-Barraza G., Rodriguez C. and Drummond H. (2024), Parental overproduction allows siblicidal bird to adjust brood
  size to climate-driven prey variation, Behavioral Ecology 35(2): 264-273: blue-footed booby broods are reduced by siblicide
  when prey is scarce, the dominant first-hatched chick attacking its sibling; https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10878367/'
