sources:
- 'Office of the Historian, US Department of State, ''The Gulf of Tonkin Incident,
  1964'': the destroyers Maddox and Turner Joy reported attacks by North Vietnamese
  patrol boats on August 2 and a second on August 4, 1964; historians later questioned
  whether the second attack took place; Congress passed the Gulf of Tonkin Resolution
  on August 7, the House unanimously and the Senate with only two votes against; it
  let the president take any measures he deemed necessary and preceded Rolling Thunder
  and ground troop deployments; https://history.state.gov/milestones/1961-1968/gulf-of-tonkin'
- 'National Security Archive (George Washington University), ''Tonkin Gulf Intelligence
  Skewed According to Official History and Intercepts'' (Dec 1, 2005): NSA declassified
  Robert Hanyok''s history; SIGINT shows a second attack on August 4, 1964 ''did not
  occur''; torpedo boats did attack the Maddox on August 2; ''the overwhelming body
  of reports, if used, would have told the story that no attack occurred''; NSA deputy
  director Louis Tordella was quoted in 1972 saying the 4 August intercepts pertained
  to the 2 August attacks; https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/press20051201.htm'
- 'Council on Foreign Relations, ''TWE Remembers: The Gulf of Tonkin Incident'': Maddox
  reported unidentified ships at 8:40 p.m. Aug 4 and maneuvered for about three hours
  against perceived attacks; Capt. Herrick''s message: ''Freak weather effects on
  radar and overeager sonarmen may have accounted for many reports'' and ''No actual
  visual sightings by MADDOX''; pilot overhead James Stockdale saw ''no boats, no
  boat wakes, no boat gunfire, no torpedo wakes, nothing but black sea and American
  firepower''; at 11:30 p.m. Johnson went on national TV announcing air strikes; Johnson
  later: ''those damn, stupid sailors were just shooting at flying fish''; https://www.cfr.org/articles/twe-remembers-gulf-tonkin-incident'
