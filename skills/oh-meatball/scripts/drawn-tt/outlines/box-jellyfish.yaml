sources:
- 'NOAA National Ocean Service, What is the most venomous marine animal?: the Australian
  box jellyfish is considered the most venomous marine animal; tentacles covered in
  nematocysts, tiny darts loaded with poison; victims may experience paralysis, cardiac
  arrest and even death within a few minutes of being stung; of about 50 box jellyfish
  species only a few have venom that can be lethal to humans; Chironex fleckeri is
  the largest, body up to one foot across with tentacles up to 10 feet long; clusters
  of eyes on each side of the box; can swim at speeds approaching four knots; may actively
  hunt shrimp and small fish; lethal kinds found mainly in the Indo-Pacific and northern
  Australia; https://oceanservice.noaa.gov/facts/box-jellyfish.html'
- 'Animal Diversity Web (University of Michigan Museum of Zoology), Chironex fleckeri:
  as many as 15 tentacles from each of the four corners (pedalia), up to 3 m long;
  transparent bell; 24 eyes but no brain; symptoms include extreme pain, shortness
  of breath and purple welts; more than 60 deaths in the last 100 years; an antivenom
  can save lives if given quickly; box jellyfish nets have been built on beaches where
  stings occur; https://animaldiversity.org/site/accounts/information/Chironex_fleckeri.html'
- 'Bielecki et al. 2014, PLoS ONE 9(6): e98870: cubozoans rely on 24 special-purpose
  eyes, six on each of four rhopalia, two of them lens eyes comparable to vertebrate
  eyes; https://doi.org/10.1371/journal.pone.0098870'
- 'O''Reilly, Isbister, Lawrie, Treston & Currie 2001, Medical Journal of Australia
  175(11): 652-655, Prospective study of jellyfish stings from tropical Australia,
  including the major box jellyfish Chironex fleckeri: 40 patients over 12 months at
  Royal Darwin Hospital, 28 typical of C. fleckeri; severe envenoming was rare, none
  life-threatening, no antivenom given, no deaths; https://www.mja.com.au/journal/2001/175/11/prospective-study-jellyfish-stings-tropical-australia-including-major-box'
