sources:
  - "Clemson University Home & Garden Information Center, Velvet Ants: wasps (Mutillidae), not ants; eastern velvet ant about 3/4 inch; dense velvety fuzz with bold warning colors; wingless females deliver a severe, very painful sting; winged males are harmless; nicknamed 'cow killers' but no record of a cow ever killed; squeak by rubbing two abdominal segments together; exoskeleton so tough that chemical and mechanical control rarely work; parasitize ground-nesting bees and wasps, laying eggs on the host's immature stages, which the developing velvet ant consumes until the host dies; adults feed on flower nectar; https://hgic.clemson.edu/factsheet/velvet-ants/"
  - "Science News (2025), Velvet ants have the Swiss Army knife of venoms (Borjon et al., Current Biology; Indiana University, University of Queensland, Utah State): scarlet velvet ant venom has 24 peptides, some targeting insect neurons and some causing pain in mammals; Justin Schmidt described the sting as 'hot oil from the deep fryer spilling over your entire hand'; extremely tough exoskeleton; mammals, reptiles, amphibians and birds react to the sting; nothing seems to consistently eat velvet ants; https://sciencenews.org/?p=3147950"
yt:
  - hook: This fuzzy red ant is actually a wasp. And they call it the cow killer.
    hero_moves: [{at: 0, dur: 1.2, pos: [720, 1500], walk: true}]
  - name: The velvet ant. No wings, and covered in red and black fuzz.
    hero_at: {x: 720}
  - fact: Only the females are wingless. The males can fly, but can't sting.
    hero_at: {x: 720}
  - xray: Her venom is a mix of twenty-four different ingredients.
    hero_at: {x: 720}
  - escalate: One scientist said the sting feels like hot oil from a deep fryer, spilling over your whole hand.
    hero_at: {x: 720}
  - calm: But relax. There's no record of it ever killing a cow.
tt:
  - fact: Those bright colors are a warning. Back off.
    hero_at: {x: 720}
  - solo: Grab it, and it squeaks, by rubbing parts of its belly together.
    zoom: 1.05
  - fact: And its armor is so tough that bug spray and swatting rarely work.
    hero_at: {x: 720}
  - solo: Scientists found that almost nothing regularly eats it.
    zoom: 1.05
  - fact: Birds, lizards, frogs and mammals all flinch at the sting.
    hero_at: {x: 720}
  - fact: Some of its venom attacks bug nerves. Some is made to hurt animals like you.
    hero_at: {x: 720}
  - escalate: Now the gross part. Mom sneaks into a bee nest, underground.
    hero_at: {x: 720}
  - fact: She lays an egg right on a baby bee.
    hero_at: {x: 720}
  - solo: Her baby hatches, and eats the baby bee, until it dies.
    zoom: 1.05
    scene_p: {time: night}
  - fact: As an adult, it just sips nectar from flowers.
    hero_at: {x: 720}
  - fact: Would you pick one up?
    hero_at: {x: 720}
  - punch: Fuzzy, cute, and it grew up eating a baby bee.
