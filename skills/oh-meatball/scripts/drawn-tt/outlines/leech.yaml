tt:
  - solo: Its spit has more than a hundred different chemicals in it.
    zoom: 1.15
    scene: microscope
    act: {xray: 1.0}
  - solo: One of them, hirudin, stops your blood from clotting.
    zoom: 1.15
    scene: microscope
  - solo: So even after it drops off, the bite keeps bleeding for hours.
    zoom: 1.15
  - solo: In the eighteen thirties, Europe used about sixty million leeches a year.
    scene: study
    scene_p: {time: night}
  - solo: One London hospital used ninety-seven thousand in a single year.
    zoom: 1.15
    scene: study
    scene_p: {time: night}
  - solo: Then medicine moved on. Until surgeons brought it back.
    zoom: 1.15
    scene: office
  - solo: When a finger gets sewn back on, blood can flow in, but not out.
    zoom: 1.15
    scene: office
  - solo: The finger swells up with trapped blood, and it can die.
    zoom: 1.15
    scene: office
  - solo: So they put a leech on it, and it drinks the extra blood.
    zoom: 1.15
    scene: office
    act: {chew: 1.0}
  - solo: In two thousand four, the US government cleared leeches as a medical device.
    zoom: 1.15
    scene: office
  - fact: Would you let one bite you?
    hero_at: {x: 760}
  - solo: The worm you'd scream at in a pond is saving fingers in hospitals.
    zoom: 1.15
    scene: swamp
    scene_p: {time: night}
