sources:
  - "U.S. FDA 510(k) K040187, Medicinal Leeches (Ricarimpex), cleared June 2004: Hirudo medicinalis cleared as a medical device, an adjunct to graft healing when venous congestion threatens the tissue; https://www.accessdata.fda.gov/cdrh_docs/pdf4/K040187.pdf"
  - "Kumar et al. / Journal of Ayurveda and Integrative Medicine (2019 review, PMC7772495), Leech therapy: saliva has more than 100 bioactive substances, is anesthetic so the host does not notice the bite, hirudin inhibits thrombin (anticoagulant); bite scar resembles the Mercedes-Benz emblem; bleeding oozes 10-48 h after the session; in 1830-1840 Europe used 60 million leeches a year; St Bartholomew's Hospital London used 97,300 leeches in 1832; used for venous congestion in reattached digits, ears, lips; https://pmc.ncbi.nlm.nih.gov/articles/PMC7772495"
  - "Lent, Fliegner, Freedman & Dickinson (1988), Ingestive behaviour and physiology of the medicinal leech, Journal of Experimental Biology 137: meal size up to 8.15 times body mass for 1 g leeches; https://authors.library.caltech.edu/records/70c1w-4gx12"
  - "PBS NOVA scienceNOW, Leeches (Mark Siddall, AMNH; Amir Taghinia and Joseph Upton, Beth Israel Deaconess): leeches take six to eight times their unfed weight in blood; in a reattached finger blood flows in but not out, pressure builds; the leech injects hirudin and the finger keeps bleeding after it falls off; https://www.pbs.org/wgbh/nova/body/leeches.html"
  - "Fields/Whitaker et al., World Journal of Surgery (2000, University of Michigan Deep Blue): the medicinal leech's small anterior sucker is used for feeding, with three jaws; https://deepblue.lib.umich.edu/bitstream/handle/2027.42/42411/268-24-7-878_00240878.pdf"
yt:
  - hook: Doctors still put blood-sucking leeches on people. On purpose.
