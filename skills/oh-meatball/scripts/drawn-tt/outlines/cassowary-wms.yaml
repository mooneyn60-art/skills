sources:
- 'Queensland Government, Southern cassowary: tropical rainforest of north Queensland and New Guinea; runs up to 50 km/h;
  good swimmer; dagger-like claw on the inner toe; males incubate the bright green eggs about 50 days and raise the striped
  chicks about nine months; disperses seeds of many rainforest plants; most attacks on people happen after cassowaries have
  been fed; https://environment.desi.qld.gov.au/wildlife/animals/living-with/cassowaries'
- 'San Diego Zoo Wildlife Alliance, Cassowary: inner claw up to about 4 inches; casque on the head; one of the heaviest birds
  after ostriches; https://animals.sandiegozoo.org/animals/cassowary'
- 'Natural History Museum (London), Birds are dinosaurs: modern birds are living theropod dinosaurs; https://www.nhm.ac.uk/discover/how-dinosaurs-evolved-into-birds.html'
