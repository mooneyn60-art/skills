sources:
- 'Florida Museum of Natural History (University of Florida), Five facts about the nine-banded armadillo: nearly always litters
  of four, identical quadruplets; when startled can jump four to five feet high, which doesn''t help against cars, so many
  are killed on roads; can hold their breath for up to six minutes and walk underwater to cross streams; mostly eat bugs,
  beetles, grubs, worms, spiders and termites; wild armadillos have passed leprosy to humans in a growing number of confirmed
  cases, so avoid handling them; https://www.floridamuseum.ufl.edu/discover/story/five-facts-nine-banded-armadillo/'
- 'National Park Service, Lincoln Boyhood National Memorial, Nine-banded Armadillo: if frightened can jump 3-4 feet straight
  up; females always deliver quadruplets, nearly identical and same-sex; hold breath up to 6 minutes; inflation of their intestines
  lets them swim, or they walk along the bottom; cannot roll into a ball; sensitive nose detects food through eight inches
  of soil; long middle claw for digging; primarily nocturnal, foraging dusk to dawn; carries the bacterium that causes leprosy;
  https://home.nps.gov/liri/learn/nature/mammals-nine-banded-armadillo.htm'
