sources:
- 'Great Lakes Fishery Commission, Sea Lamprey: no jaws, cartilage skeleton; a large oral sucking disk filled with sharp horn-shaped
  teeth around a razor-sharp rasping tongue; attaches and rasps through scales and skin, secreting an enzyme that stops blood
  clotting like a leech; each can kill up to 40 lb of fish in its 12-18 month feeding period; largely unchanged for more than
  340 million years, survived at least four major extinctions; first recorded in Lake Ontario 1835, Welland Canal improvements
  let it past Niagara Falls into Lake Erie by 1921 and Lake Superior by 1938; lake trout catch fell from about 15 million
  lb a year to about 300,000 lb; up to 85 percent of surviving fish bore lamprey wounds; https://www.glfc.org/sea-lamprey.php'
- 'U.S. Fish and Wildlife Service, Sea Lamprey: larvae develop in stream sediment for about four to 17 years; a female can
  produce up to 100,000 eggs; females die soon after spawning, males within one to three days; https://www.fws.gov/midwest/SeaLamprey/'
