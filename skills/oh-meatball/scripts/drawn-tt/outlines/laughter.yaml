sources:
  - "Christian F. Hempelmann, 'The laughter of the 1962 Tanganyika laughter epidemic', Humor: International Journal of Humor Research 20(1), 2007, pp. 49-71, DOI 10.1515/HUMOR.2007.003, quoting Rankin and Philip (1963, Central African Journal of Medicine): the disease began on 30 January 1962 at a mission-run girls' school at Kashasha, 25 miles from Bukoba, when three pupils began to act abnormally; by 18 March 1962, when the school was forced to close, 95 of the 159 pupils were affected; 57 more pupils after it reopened on 21 May until it shut again; attacks of laughing and crying lasting a few hours, in a few cases up to 16 days, with restlessness; spread to Nshamba village (217 people) and Ramashenye girls' middle school (48 of 154 pupils), with further school closures; tests for food poisoning and toxic substances were negative; Rankin and Philip suggested mass hysteria; Hempelmann argues it was mass psychogenic illness and links it to stress, noting Tanganyika became independent on 9 December 1961; https://doi.org/10.1515/HUMOR.2007.003"
  - "Office of the Historian, US Department of State, 'Tanzania - Countries': the US recognized Tanganyika on December 9, 1961, when it won independence from Great Britain; https://history.state.gov/countries/tanzania"
