tt:
  - fact: So the girls were sent home. And it went with them.
  - solo: In one village, two hundred and seventeen people started laughing and crying.
    hero: false
    scene_p: {huts: [[260, 0.7], [860, 0.75]]}
    with: [{type: student, x: 420, y: 1640, s: 0.6, pop: false, front: true, p: {laugh: 1.0, seed: 2}}, {type: student, x: 680, y: 1700, s: 0.6, pop: false, front: true, p: {laugh: 1.0, cry: true, seed: 6}}]
  - fact: At another girls' school, forty-eight more.
  - fact: Kashasha reopened in May. Fifty-seven more girls caught it, and it shut again.
    hero: {laugh: 1.0}
  - fact: Doctors tested for food poisoning and toxins. Nothing.
  - calm: No poison, no germ found. The cause was in their minds, and the symptoms were real.
  - fact: Experts call it mass psychogenic illness. Stress, spreading from person to person.
  - fact: And the country had become independent just seven weeks before. Huge change. Huge stress.
  - fact: Could you watch someone laugh and not laugh too?
    hero: {laugh: 1.0}
  - punch: Laughter really was contagious. And nobody was having any fun.
