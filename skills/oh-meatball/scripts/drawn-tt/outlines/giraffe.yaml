sources:
- 'San Diego Zoo Wildlife Alliance, Animals and Plants: Giraffe: males up to 18 ft tall and 3,000 lb; the neck alone weighs
  about 600 lb; tongue 18 in (46 cm), its dark colour thought to protect it from sunburn; heart about 2 ft long and 25 lb;
  seven neck vertebrae like humans, each can be over 10 in long; defends itself with a deadly kick; needs only 5 to 30 minutes
  of sleep in 24 hours, often in naps of a minute or two; males spar by swinging their necks; born as the mother stands, the
  cord breaks and the newborn falls to the ground; calf stands and walks after about an hour; record running speed 34.7 mph;
