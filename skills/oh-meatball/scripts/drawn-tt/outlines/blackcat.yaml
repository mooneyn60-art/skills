sources:
- 'Novotny F. (2021) ''The Birth of the Luciferians: Revisiting the Persecution of
  Heretics by Conrad of Marburg'', Mediaeval Studies 83:119-164 (Pontifical Institute
  of Mediaeval Studies): Pope Gregory IX''s bull Vox in Rama (1233), addressed to
  Conrad of Marburg, German prelates, Emperor Frederick II and Henry VII, describes
  a Luciferian sect; quotes the bull: a black cat the size of a medium dog descends
  backwards down a statue with its tail turned back, and the novice, the master and
  then each member kiss its hindquarters; historians (Hergemoller, Brunn, Novotny)
  conclude a small circle including Conrad fabricated the Luciferian sect; cat-worship
  accusations were older topoi: heretics of Orleans burned in 1022, Walter Map (c.1180),
  Alan of Lille deriving ''Cathar'' from cattus because Lucifer appears to them as
  a cat, and a Mainz exorcism account of the devil as a white cat as big as a medium-sized
  dog covered with bird feathers; https://pims.ca/wp-content/uploads/2022/04/MS-83-119.pdf'
- 'The Metropolitan Museum of Art, Statuette of cat-headed Bastet (58.67), collection
  notes: Bastet shown as a cat-headed goddess, a powerful protective figure; her main
  cult center was Bubastis in the Delta, where thousands of cat mummies and many cat
  statuettes were found; https://www.metmuseum.org/art/collection/search/558306'
- 'UC Davis Veterinary Genetics Laboratory, Agouti (cat) test: the agouti signaling
  protein switches hairs between black and red pigment, creating bands; a 2 bp deletion
  in ASIP (c.123delCA) stops the switch, so a/a cats have solid self-coloured coats;
  https://vgl.ucdavis.edu/test/agouti-cat'
