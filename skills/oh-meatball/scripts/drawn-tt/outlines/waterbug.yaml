sources:
- 'University of Maine Cooperative Extension, Giant Water Bug (Lethocerus americanus)
  fact sheet: 2 to 4 inches long, the largest true bug (Hemiptera) in the US and Canada;
  common names include toe-biters (they can inflict a painful bite) and electric-light
  bugs (adults fly and are attracted to lights at night); https://extension.umaine.edu/home-and-garden-ipm/fact-sheets/common-name-listing/giant-water-bug/'
- 'KQED Science / Deep Look (PBS), Don''t Go Chasing Water Bugs, quoting entomologists
  Chris Goforth (North Carolina Museum of Natural Sciences) and Robert Sites (University
  of Missouri): bite among the most painful of any insect, delivered with dagger-like
  mouthparts; they inject venom that liquefies the prey''s insides and suck it back
  out, the prey likely still alive; they eat animals as large as turtles, snakes and
  ducklings; in Abedus the female glues eggs onto the male''s back and leaves, and
  he carries them for several weeks; in parts of Asia they are a delicacy, with a
  nutty flavour; Santa Monica Mountains rangers warned of bites in 2018; https://www.kqed.org/science/1979474/dont-go-chasing-water-bugs'
