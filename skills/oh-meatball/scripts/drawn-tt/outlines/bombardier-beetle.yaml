sources:
- 'Sugiura & Sato 2018, Biology Letters 14: 20170647, Successful escape of bombardier
  beetles from predator digestive systems: Japanese toads (Bufo japonicus) and stream
  toads (B. torrenticola) that swallowed Pheropsophus jessoensis vomited them 12-107
  min later; 43% of swallowed beetles escaped this way, all alive and active; popping
  sounds were heard from inside the toads; beetles made to discharge their spray beforehand
  were almost never vomited; https://doi.org/10.1098/rsbl.2017.0647'
- 'Eisner''s research: Aneshansley, Eisner et al. 1969, Science 165: 61-63, Biochemistry
  at 100 C: explosive secretory discharge of bombardier beetles (hydroquinones and
  hydrogen peroxide from a reservoir mixed with catalases and peroxidases in a reaction
  chamber, spray ejected at about 100 C with an audible pop); Eisner & Aneshansley
  1999, PNAS 96: 9705-9709, Spray aiming in the bombardier beetle: they rotate the
  abdominal tip to aim the spray at a grabbed leg, even forward over the back; https://doi.org/10.1073/pnas.96.17.9705'
- 'Arndt et al. 2015, Science 348: 563-567, Mechanistic origins of bombardier beetle
  (Brachinini) explosion-induced defensive spray pulsation: synchrotron X-ray imaging
  shows the spray comes out as a rapid series of pulses (hundreds per second, about
  500 Hz in Brachinus per Dean et al. 1990, Science 248: 1219-1221); https://doi.org/10.1126/science.1261166'
