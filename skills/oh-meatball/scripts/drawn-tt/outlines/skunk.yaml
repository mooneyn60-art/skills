sources:
- 'Texas Parks and Wildlife, Introducing Mammals: Skunks: each of the two glands holds
  about a tablespoon of musk, enough for five or six shots; a full refill takes several
  days; can fire right, left, front and back without turning around; targets within
  ten to twelve feet usually in range; warns by arching its back, raising its tail
  and stamping its front feet, and may rear on its front legs as if doing a handstand
  to spray over its head; a direct hit in the face can cause painful but temporary
  blindness; insects and grubs are at least half its diet; great horned owls and coyotes
  occasionally kill skunks; https://tpwd.texas.gov/publications/nonpwdpubs/introducing_mammals/skunks'
- 'Illinois Department of Natural Resources, Wildlife Illinois, Striped Skunk: size
  of a small house cat; can accurately direct its musk up to 10 feet, some reaching
  nearly 20 feet; stamps its front feet and raises its tail as a warning; the musk
  is butyl mercaptan, a strong sulfur odor; can carry rabies; odor-removal mix of
  3% hydrogen peroxide, baking soda and liquid soap; https://wildlifeillinois.org/identify-wildlife/striped-skunk/'
- 'National Geographic Kids, Skunk: great horned owls are a main predator, and scientists
  think their weak sense of smell makes the spray useless against them; https://kids.nationalgeographic.com/animals/mammals/skunk/'
