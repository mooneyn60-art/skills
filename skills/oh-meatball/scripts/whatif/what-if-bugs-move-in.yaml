slug: what-if-bugs-move-in
title: "What If Bugs Lived in Your House for 60 Years? 🪳🌲"
title_text: What if bugs lived in your house for 60 years?
format: whatif_flat (tools/whatif_flat.py), research/63; slow 60-year ramp (Nolan 11/03)
counter_label: DAYS THE BUGS LIVE HERE
counter_roll: full
music_ramp: [0.3, 1.0]
end_card: {top: "WOULD YOU MOVE", accent: "BACK IN?", comment: "Comment  YES  or  NO"}
cap_key: [day, week, month, year, mites, fly, cockroaches, spiders, centipedes, mold, termites, mice, bats, raccoons, tree, forest, nature, roof, floors, seed, fungi]
sources:
  - "University of Kentucky Entomology, House Dust Mites (Ent-646): mites feed on skin scales shed by people and pets and live in house dust; https://entomology.mgcafe.uky.edu/ef646"
  - "University of Kentucky Entomology, Fruit Flies (Ent-621): fruit flies are attracted to ripened or fermenting fruit and breed on it; https://entomology.mgcafe.uky.edu/ef621"
  - "University of Kentucky Entomology, Cockroach Control Manual (Ent-614): German cockroaches hide in dark cracks and breed near food and moisture; up to 40 nymphs emerge from each egg case; https://entomology.mgcafe.uky.edu/ef614"
  - "UC IPM Pest Notes: Spiders (Pub. 7442): spiders feed on the insects in a building; cobweb spiders catch insects that walk or fly into their webs; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7442.html"
  - "Connecticut Agricultural Experiment Station, House Centipede fact sheet: hunts cockroach nymphs, flies, silverfish and spiders; https://portal.ct.gov/-/media/caes/documents/publications/fact_sheets/entomology/house_centipede_scutigera.pdf"
  - "US EPA, A Brief Guide to Mold, Moisture and Your Home: water-damaged areas must be dried within 24-48 hours to prevent mold growth; https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home"
  - "UC IPM Pest Notes: Subterranean and Other Termites (Pub. 7415): colonies range from a mated pair to hundreds of thousands or even millions; subterranean termites need moisture; damage is inside the wood; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7415.html"
  - "UC IPM Pest Notes: House Mouse (Pub. 7483): mice can enter through openings as small as 1/4 inch; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7483.html"
  - "UC IPM Pest Notes: Bats (Pub. 74150): several bat species frequently roost in attics and barns; bats squeeze through 1/4-inch openings; https://ipm.ucanr.edu/PMG/PESTNOTES/pn74150.html"
  - "UC IPM Pest Notes: Raccoons (Pub. 74116): females seeking nest sites may rip off shingles, fascia boards or roof vents to get into attics; attics and chimneys are used as dens; https://ipm.ucanr.edu/PMG/PESTNOTES/pn74116.html"
  - "Alan Weisman, The World Without Us (2007), chapter 'Unbuilding Our Home', and History Channel's Life After People (2008): an unmaintained wood-frame house decays from the roof and water leaks; rot weakens floors and walls; trees can take root inside; within decades a wooden house in a wet climate can collapse into the forest floor. These are popular-science projections; real timelines vary widely with climate and construction, so the script says 'can' and 'may'."
  - "Timeline framing: Day 1 to Year 60 is a what-if; the counter is days (1, 7, 30, 365, 1,826, 3,652, 7,305, 14,610, 21,915)."
tt:
  - {say: "What if bugs lived in your house for 60 years?", counter: 21915, stat: "YEAR 60", max_shot: 1.0, shots: [forest_ruin, house_ruin]}
  - {say: "Day 1. Everyone moves out and locks the door. Nobody cleans. Nobody sprays.", counter: 1, stat: "DAY 1", max_shot: 2.4, shots: [house_empty, empty_room]}
  - {say: "At first, almost nothing. A few dust mites live in the dust you left.", max_shot: 2.4, shots: [bed, mite_zoom]}
  - {say: "Week 1. One fruit fly finds a forgotten banana.", counter: 7, stat: "WEEK 1", max_shot: 2.2, shots: [sink, banana]}
  - {say: "Month 1. Cockroaches breed in the dark. One egg case can hatch up to 40 babies.", counter: 30, stat: "MONTH 1", max_shot: 1.9, shots: [kitchen_dark, eggcase, crumbs]}
  - {say: "Spiders move in to eat them. Then centipedes come for the spiders.", max_shot: 1.8, shots: [web, centipede_wall, chase]}
  - {say: "Year 1. Water gets in, and mold can start growing in a day or two.", counter: 365, stat: "YEAR 1", max_shot: 1.6, shots: [roof_leak, mold]}
  - {say: "Termites find the damp wood. A colony can grow to hundreds of thousands.", max_shot: 1.6, shots: [termite, termite_wood]}
  - {say: "Year 5. Mice squeeze through gaps a quarter inch wide. Bats roost in the attic.", counter: 1826, stat: "YEAR 5", max_shot: 1.4, shots: [mice, attic_bats]}
  - {say: "Year 10. Raccoons rip their way into the attic. The roof starts to sag.", counter: 3652, stat: "YEAR 10", max_shot: 1.3, shots: [raccoon, roof_leak, mold]}
  - {say: "Year 20. Rotting floors can give way, and a seed sprouts in the living room.", counter: 7305, stat: "YEAR 20", max_shot: 1.2, shots: [rot_floor, floor_hole, sapling]}
  - {say: "Year 40. That tree may punch through the roof. The walls start to lean.", counter: 14610, stat: "YEAR 40", max_shot: 1.0, shots: [tree_roof, house_ruin, sapling]}
  - {say: "Year 60. What's left can sink into the forest floor.", counter: 21915, stat: "YEAR 60", max_shot: 0.9, shots: [house_ruin, forest_ruin, termite_wood]}
  - {say: "Beetles, ants and fungi finish the last of the wood. Nature takes it all back.", max_shot: 0.9, shots: [forest_ruin, ant, rot_floor, beetle]}
  - {say: "Would you move back in? Comment yes or no.", shots: [end]}
