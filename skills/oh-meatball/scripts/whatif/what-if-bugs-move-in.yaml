slug: what-if-bugs-move-in
title: "What If You Let the Bugs Move In? 🪳😨"
title_text: What if you let the bugs move in?
format: whatif_flat (tools/whatif_flat.py), research/63
counter_label: DAYS THE BUGS LIVE HERE
end_card: {top: WOULD YOU SURVIVE, accent: "DAY 365?", comment: "Comment  YES  or  NO"}
cap_key: [day, mites, cockroaches, roaches, spiders, centipedes, termites, thousands, bugs, hunters, webs, legs, wood, survive]
sources:
  - "University of Kentucky Entomology, House Dust Mites (Ent-646): primary food is skin scales shed by people and pets; thousands of mites in a single gram of house dust are not uncommon; https://entomology.mgcafe.uky.edu/ef646"
  - "University of Kentucky Entomology, Cockroach Control Manual (Ent-614): German cockroaches favour warm, humid kitchens and bathrooms near food and water; spills, food waste and dirty dishes feed them; they hide in cracks and crevices by day and are active at night; up to 40 nymphs emerge from each egg case; https://entomology.mgcafe.uky.edu/ef614"
  - "UC IPM Pest Notes: Spiders (Pub. 7442): spiders are mostly beneficial because they feed on pest insects; cobweb spiders (Theridiidae, incl. the common house spider) feed on insects that walk or fly into their webs; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7442.html"
  - "Connecticut Agricultural Experiment Station, House Centipede fact sheet: 15 pairs of legs (thirty legs); hunts cockroach nymphs, flies, silverfish and spiders; https://portal.ct.gov/-/media/caes/documents/publications/fact_sheets/entomology/house_centipede_scutigera.pdf"
  - "Penn State Extension, House Centipedes: often come up from damp basements; feed on cockroaches, spiders and other small arthropods; frequent sightings indicate some prey arthropod is abundant; https://extension.psu.edu/house-centipedes"
  - "UC IPM Pest Notes: Subterranean and Other Termites (Pub. 7415): subterranean termites need moisture and soil contact, attack wood from the inside, and damage is often hidden until it is extensive; https://ipm.ucanr.edu/PMG/PESTNOTES/pn7415.html"
  - "Timeline framing: the DAY numbers are a what-if story, not a measured invasion schedule; each creature fact is from the sources above."
tt:
