  - {say: "Day 1. You stop cleaning. Nothing seems to happen.", counter: 1, stat: "MOVED IN: NOTHING YET", shots: [calendar, you]}
  - {say: "But dust mites already live in your bed, eating the skin you shed.", stat: "MOVED IN: DUST MITES", shots: [bed, mite_zoom]}
  - {say: "A single gram of dust can hold thousands of them.", shots: [mites, mite]}
  - {say: "Day 7. Crumbs, spills and dirty dishes pile up.", counter: 7, shots: [calendar, trash]}
  - {say: "German cockroaches move in. They love warm, damp kitchens.", stat: "MOVED IN: COCKROACHES", shots: [roach, fridge]}
  - {say: "One egg case hatches up to 40 babies.", shots: [eggcase, crumbs]}
  - {say: "They hide in the cracks by day and come out at night.", shots: [kitchen_dark, swarm]}
  - {say: "Day 30. All those bugs are food. So the hunters arrive.", counter: 30, shots: [calendar, kitchen_dark]}
  - {say: "House spiders build webs in the corners and catch what wanders in.", stat: "MOVED IN: HOUSE SPIDERS", shots: [spider, web]}
  - {say: "Day 100. Something faster comes up from the basement.", counter: 100, shots: [stairs, centipede_wall]}
  - {say: "House centipedes. Thirty legs, and they hunt roaches and spiders.", stat: "MOVED IN: CENTIPEDES", shots: [centipede, chase]}
  - {say: "Lots of centipedes means lots of bugs for them to eat.", shots: [wall_many, chase]}
  - {say: "Day 365. Under the floor, termites find damp wood.", counter: 365, stat: "MOVED IN: TERMITES", shots: [house, termite_wood]}
  - {say: "They eat it from the inside, and the damage hides in your walls.", shots: [termite, termite_wood]}
  - {say: "Mites, roaches, spiders, centipedes, termites. It's their house now.", shots: [nightmare, wall_many]}
  - {say: "Would you survive day 365? Comment yes or no.", shots: [end]}
