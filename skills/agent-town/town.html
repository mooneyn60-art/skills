<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Town</title>
<meta name="description" content="A pixel-art town with one building per AI agent; tap a building to open that agent's live dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07091a; --bg2:#0d1028; --panel:#0e1119; --panel2:#151a26; --line:#252c3d;
  --text:#e8ecf6; --muted:#8b93a7; --dim:#5a6175;
  --green:#3ddc97; --amber:#ffc857; --blue:#5ec8ff; --red:#ff5d73; --purple:#b48cff; --pink:#ff8ac6;
  --u:4.5px; --accent:#3ddc97;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);overflow-x:hidden}
body{
  font:15px/1.45 Inter,system-ui,sans-serif; min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a1d4a 0%, transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
    var(--bg);
}
.app{max-width:560px;margin:0 auto;padding:12px 12px 14px;display:flex;flex-direction:column;gap:9px}
.pix{font-family:"Press Start 2P",monospace;letter-spacing:.02em}
.vt{font-family:VT323,monospace}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mark{width:34px;height:34px;flex:none;image-rendering:pixelated}
.logo h1{font-size:17px;line-height:1.2;color:#fff;text-shadow:0 0 12px rgba(180,140,255,.55),2px 2px 0 #3b2a7a}
.logo p{font:13px/1.2 Inter,sans-serif;color:var(--muted);margin-top:5px}
.clock{flex:none;text-align:right;font-family:VT323,monospace;font-size:20px;line-height:1;color:var(--green);
  background:#0a1410;border:1px solid #1d4a37;border-radius:8px;padding:6px 9px;box-shadow:inset 0 0 12px rgba(61,220,151,.12)}
.clock small{display:block;font-size:14px;color:#6fb596;margin-top:2px}

/* ticker */
.ticker{position:relative;overflow:hidden;height:30px;border:1px solid var(--line);border-radius:8px;background:#0a0d18;
  display:flex;align-items:center}
.ticker .lbl{flex:none;z-index:2;height:100%;display:flex;align-items:center;gap:6px;padding:0 9px;background:#140c1e;
  border-right:1px solid var(--line);font-size:8px;color:var(--red)}
.ticker .lbl i{width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 8px var(--red)}
.ticker .track{white-space:nowrap;font-family:VT323,monospace;font-size:19px;color:#c9cfe0;will-change:transform;padding-left:10px}
.ticker .track b{font-weight:400}
.ticker .sep{color:var(--dim);margin:0 12px}

/* town */
.town{position:relative;width:100%;aspect-ratio:120/141;border-radius:14px;overflow:hidden;
  border:1px solid #2a2f52;box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 4px #0b0e22,0 0 40px rgba(120,90,255,.12)}
.town canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hit{position:absolute;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.hit:focus-visible .tag{outline:2px solid #fff;outline-offset:2px}
.tag{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  white-space:nowrap;pointer-events:none;
  padding:calc(var(--u)*.55) calc(var(--u)*1.1) calc(var(--u)*.45);border-radius:calc(var(--u)*1);
  background:rgba(8,10,20,.88);border:max(1px,calc(var(--u)*.3)) solid var(--accent);
  box-shadow:0 0 calc(var(--u)*2) color-mix(in srgb,var(--accent) 45%,transparent),0 calc(var(--u)*.5) 0 rgba(0,0,0,.5);
  transition:transform .15s}
.tag .n{display:flex;align-items:center;gap:calc(var(--u)*.7);font-family:"Press Start 2P",monospace;
  font-size:calc(var(--u)*1.55);color:#fff;line-height:1.15}
.tag .n i{width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:var(--dot,var(--green));
  box-shadow:0 0 calc(var(--u)*1) var(--dot,var(--green));flex:none}
.tag .r{font-family:VT323,monospace;font-size:calc(var(--u)*2.15);line-height:1;color:color-mix(in srgb,var(--accent) 70%,#fff);margin-top:calc(var(--u)*.15)}
.hit:hover .tag,.hit.sel .tag{transform:translateX(-50%) translateY(calc(var(--u)*-.6))}

/* roster */
.roster{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;color:var(--text);font:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .ic{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 16%,#0b0e16);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);
  font-family:"Press Start 2P",monospace;font-size:11px;color:var(--accent)}
.card .t{min-width:0}
.card .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.3;color:var(--muted)}
.card .st i{margin-top:4px}
.card .st i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--dot);box-shadow:0 0 6px var(--dot)}
.foot{font-size:11px;color:var(--dim);text-align:center;line-height:1.5}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(3,4,12,.62);backdrop-filter:blur(3px);opacity:0}
.panel{position:absolute;left:50%;bottom:0;width:min(560px,100%);height:min(88vh,860px);
  transform:translate(-50%,105%);background:var(--panel);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -20px 60px rgba(0,0,0,.6),0 -1px 0 var(--accent),0 -10px 40px color-mix(in srgb,var(--accent) 22%,transparent)}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:160px;pointer-events:none;
  background:radial-gradient(400px 160px at 20% 0,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%)}
.grab{flex:none;height:22px;display:grid;place-items:center}
.grab span{width:44px;height:5px;border-radius:3px;background:#2f3648}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 18px 30px;scrollbar-width:thin;scrollbar-color:#2a3142 transparent}
.ph{display:flex;align-items:center;gap:14px;position:relative}
.ph canvas{flex:none;width:76px;height:76px;image-rendering:pixelated;border-radius:12px;background:#0a0d18;border:1px solid var(--line)}
.ph .who{min-width:0;flex:1}
.ph h2{font-family:"Press Start 2P",monospace;font-size:15px;line-height:1.3;color:#fff}
.ph .ttl{color:var(--accent);font-weight:600;font-size:14px;margin-top:5px}
.close{position:absolute;top:-2px;right:-4px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);font-size:18px;cursor:pointer}
.close:hover{color:#fff;border-color:var(--accent)}
.statusrow{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff);
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);text-transform:uppercase;letter-spacing:.04em}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.role{color:#c4cada;font-size:14.5px;margin:12px 0 16px}
.sec{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--muted);letter-spacing:.08em;margin:20px 0 10px;
  display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:linear-gradient(180deg,var(--panel2),#10141e);border:1px solid var(--line);border-radius:12px;padding:10px 12px 11px;min-width:0}
.kpi .v{font-family:VT323,monospace;font-size:44px;line-height:.9;color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.kpi .v.na{color:var(--dim);text-shadow:none}
.kpi .l{font-weight:600;font-size:13px;margin-top:5px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35}
.sched{background:#0b0e17;border:1px solid var(--line);border-radius:12px;padding:12px}
.sched .sum{font-size:13.5px;color:#d5dae6;margin-bottom:10px}
.hm{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;align-items:center}
.hm .hl{font-family:VT323,monospace;font-size:14px;color:var(--dim);line-height:1}
.hm .dl{font-family:VT323,monospace;font-size:15px;color:var(--muted);line-height:1}
.hm .dl.today{color:#fff}
.hm .c{aspect-ratio:1;border-radius:2px;background:#161b28}
.hm .c.run{background:var(--accent);box-shadow:0 0 6px color-mix(in srgb,var(--accent) 60%,transparent)}
.hm .c.alt{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.5)}
.hm .c.day{background:color-mix(in srgb,var(--accent) 30%,#161b28)}
.hm .c.now{outline:2px solid #fff;outline-offset:1px;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.ondemand{display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed #2f3648;border-radius:10px;color:var(--muted);font-size:13px}
.feed{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #1a1f2c;align-items:baseline}
.row .w{font-family:VT323,monospace;font-size:17px;color:var(--accent)}
.row .x{font-size:13.5px;color:#d1d6e2;min-width:0;overflow-wrap:anywhere}
.row .x .tg{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;
  background:color-mix(in srgb,var(--red) 18%,transparent);color:#ff8f9e;border:1px solid color-mix(in srgb,var(--red) 45%,transparent)}
.row .x .tg.p{background:color-mix(in srgb,var(--blue) 18%,transparent);color:#9bdcff;border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.titles span{font-size:12px;padding:4px 9px;border-radius:7px;background:#1a1610;border:1px solid #4a3d1c;color:#f2d68a}
.src{margin-top:18px;padding:12px;border-radius:10px;background:#0a0d15;border:1px solid #1a1f2c;font-size:12px;color:var(--muted)}
.src code{font-family:VT323,monospace;font-size:15px;color:#aab3c7;overflow-wrap:anywhere}
.src p{margin-top:6px}
@media (max-width:420px){
  .app{padding:10px 10px 16px}
  .logo h1{font-size:14px}
  .logo p{font-size:12px}
  .clock{font-size:17px;padding:5px 7px}
  .kpi .v{font-size:38px}
  .scroll{padding:2px 14px 28px}
  .hm{grid-template-columns:24px repeat(24,1fr);gap:1.5px}
}
@media (prefers-reduced-motion:reduce){.tag,.card{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="logo">
      <canvas class="mark" id="mark" width="17" height="17" aria-hidden="true"></canvas>
      <div><h1 class="pix">AGENT TOWN</h1><p id="sub">6 agents on shift</p></div>
    </div>
    <div class="clock" id="clock" aria-live="off">--:--<small>ET</small></div>
  </header>
  <div class="ticker" aria-hidden="true"><div class="lbl pix"><i></i>FEED</div><div class="track" id="track"></div></div>
  <section class="town" id="town" aria-label="Pixel-art town, one building per agent">
    <canvas id="cv"></canvas>
  </section>
  <nav class="roster" id="roster" aria-label="Agents"></nav>
  <p class="foot" id="foot"></p>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pname">
    <div class="grab"><span></span></div>
    <div class="scroll" id="pscroll"></div>
  </div>
</div>

  paige(P, x, y, f) { SPR.person(P, x, y, f, "#ff8a65", "#ff8a65", "#2c2f3a", () => { P.r(x - .2, y - 6.6, .7, 3, "#ff8a65"); P.r(x + 3, y - 3.8, 1, 1.4, "#e9e6f0"); }); },
  pine(P, x, y, f) { SPR.person(P, x, y, f, "#3f7d4e", "#c0563a", "#5a3b24", () => { P.r(x + .2, y - 7.6, 2.6, .7, "#3f7d4e"); P.r(x + 1.2, y - 8.1, .6, .5, "#f2c14e"); P.r(x, y - 3.5, 3, .3, "#8a3020"); }); },
  doc(P, x, y, f) { SPR.person(P, x, y, f, "#2b2b35", "#e8eef5", "#2c4a6a", () => { P.r(x + 1.1, y - 7.4, .8, .8, "#5ec8ff"); P.r(x + 1.25, y - 4.5, .5, 2.4, "#b9c6d6"); }); },
  meatball(P, x, y, f) {
    P.r(x - .5, y - 4.5, 4.5, 4, "#ffb347"); P.r(x - .5, y - 5.3, 1, .9, "#ffb347"); P.r(x + 3, y - 5.3, 1, .9, "#ffb347");
    P.r(x + .3, y - 3.7, .7, .7, "#2fbf5b"); P.r(x + 2, y - 3.7, .7, .7, "#2fbf5b");
    P.r(x + .7, y - 1.8, 2, .8, "#e63946");
    P.r(x + (f ? 0 : .5), y - .5, 1, .5, "#e2851a"); P.r(x + (f ? 2.5 : 2), y - .5, 1, .5, "#e2851a");
    P.r(x + 4, y - 3 + (f ? 0 : -.5), .6, 2, "#e2851a");
  },
  owl(P, x, y, f) {
    const hop = f ? -.5 : 0;
    P.r(x, y - 5 + hop, 3.4, 4.6, "#7a5230"); P.r(x + .5, y - 3 + hop, 2.4, 2.2, "#c49a6c");
    P.r(x + .2, y - 4.6 + hop, 1.2, 1.2, "#ffd166"); P.r(x + 2, y - 4.6 + hop, 1.2, 1.2, "#ffd166");
    P.r(x + .6, y - 4.2 + hop, .5, .5, "#1b1020"); P.r(x + 2.3, y - 4.2 + hop, .5, .5, "#1b1020");
    P.r(x + .5, y - .4, .8, .4, "#e8a33a"); P.r(x + 2.1, y - .4, .8, .4, "#e8a33a");
  },
};
const walkers = Object.keys(LOOK).map((id, i) => {
  const L = LOOK[id];
  return {id, L, min: L.bx + 1, max: L.bx + L.bw - 6, speed: 2.4 + (i % 3) * .5, phase: i * 1.7};
});
function walkerPos(w, t) {
  const span = w.max - w.min, s = t / 1000 * w.speed / span + w.phase;
  const tri = Math.abs(((s % 2) + 2) % 2 - 1); // 0..1..0
  const pause = (Math.sin(t / 2300 + w.phase * 3) > .82);
  return {x: w.min + tri * span, dir: (((s % 2) + 2) % 2) < 1 ? 1 : -1, moving: !pause};
}
let frozenX = {};

// ---------- fireflies / stars ----------
const STARS = Array.from({length: 46}, (_, i) => { const r = rng(300 + i); return [r() * W, r() * 12, r() * 6.28, r() < .15]; });
const FLIES = Array.from({length: 9}, (_, i) => { const r = rng(900 + i); return [r() * W, 18 + r() * (H - 22), r() * 6.28]; });

// ---------- main canvas ----------
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const townEl = document.getElementById("town");
let U = 4.5, scene = null, sel = null, ripple = null, shoot = null;
function resize() {
  const r = townEl.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  U = cv.width / W;
  document.documentElement.style.setProperty("--u", (r.width / W) + "px");
  scene = document.createElement("canvas"); scene.width = cv.width; scene.height = cv.height;
  drawScene(painter(scene.getContext("2d"), U));
  frame();
}
function render(t) {
  if (!scene) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scene, 0, 0);
  const P = painter(ctx, U);
  // stars
  STARS.forEach(([x, y, ph, big]) => {
    const a = .35 + .65 * Math.max(0, Math.sin(t / 900 + ph));
    ctx.globalAlpha = a; P.r(x, y, big ? 1 : .5, big ? 1 : .5, "#ffffff");
  });
  ctx.globalAlpha = 1;
  // shooting star every ~9s
  const cyc = (t % 9000) / 9000;
  if (cyc < .09) { const p = cyc / .09, x = 20 + p * 50, y = 2 + p * 8; for (let k = 0; k < 6; k++) { ctx.globalAlpha = (1 - p) * (1 - k / 6); P.r(x - k * 1.4, y - k * .55, 1, .5, "#fff"); } ctx.globalAlpha = 1; }
  // clouds
  [[0, 3.5, 22, .006], [1, 9, 16, .004]].forEach(([i, y, w, sp]) => {
    const x = ((t * sp + i * 70) % (W + w + 10)) - w - 5;
    ctx.globalAlpha = .35; P.r(x, y, w, 1.5, "#3b2f72"); P.r(x + 3, y - 1, w - 7, 1, "#3b2f72"); ctx.globalAlpha = 1;
  });
  // lamp posts
  const lamps = [];
  ROW.forEach(rw => { lamps.push([54.5, rw.road - .5], [65, rw.road - .5]); });
  lamps.forEach(([x, y]) => lamp(P, x, y, t));
  // buildings
  Object.keys(B).forEach(id => {
    if (sel === id) {
      const [bx, top, bw] = BOX[id], rw = ROW[LOOK[id].row];
      const a = .25 + .2 * Math.sin(t / 180);
      ctx.globalAlpha = a; P.r(bx, Math.max(top, 14), bw, rw.base - Math.max(top, 14), LOOK[id].accent); ctx.globalAlpha = 1;
    }
    B[id](P, t);
  });
  lamps.forEach(([x, y]) => lampGlow(P, x, y));
  // window glows (soft)
  P.glow(28, 31, 22, "rgba(61,220,151,A)", .07);
  P.glow(29, 77, 20, "rgba(255,207,107,A)", .07);
  P.glow(92, 112, 16, "rgba(180,140,255,A)", .1);
  // sprites
  walkers.forEach(w => {
    const rw = ROW[w.L.row];
    let p = walkerPos(w, t);
    const x = p.x, f = p.moving ? Math.floor(t / 220 + w.phase * 10) % 2 : 0;
    const y = rw.base + 6.6;
    ctx.globalAlpha = .35; P.r(x - .3, y - .2, 3.8, .6, "#000"); ctx.globalAlpha = 1;
    SPR[w.id](P, x, y, f);
    P.text(w.L.sprite, x + 1.5, y - 8.3, 2.3, "#ffffff");
  });
  // fireflies
  FLIES.forEach(([x, y, ph]) => {
    const fx = x + Math.sin(t / 1700 + ph) * 3, fy = y + Math.cos(t / 1300 + ph) * 2, a = Math.max(0, Math.sin(t / 700 + ph * 2));
    ctx.globalAlpha = a; P.r(fx, fy, .5, .5, "#fff3a0"); P.glow(fx + .25, fy + .25, 1.6, "rgba(255,243,160,A)", .5 * a); ctx.globalAlpha = 1;
  });
  // tap ripple
  if (ripple) {
    const p = (t - ripple.t0) / 650;
    if (p >= 1) ripple = null;
    else {
      const R2 = 2 + p * 9;
      ctx.globalAlpha = 1 - p;
      for (let a = 0; a < 6.28; a += .2) P.r(ripple.x + Math.cos(a) * R2 - .4, ripple.y + Math.sin(a) * R2 - .4, .8, .8, "#ffffff");
      P.disc(ripple.x, ripple.y, Math.max(.8, 2.4 - p * 2), "#ffffff");
      ctx.globalAlpha = 1;
    }
  }
}

// ---------- DOM ----------
const sheet = document.getElementById("sheet"), panel = document.getElementById("panel"), scrim = document.getElementById("scrim"), ps = document.getElementById("pscroll");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = v => (v === null || v === undefined || v === "") ? "—" : (typeof v === "number" ? v.toLocaleString("en-US") : String(v));

function buildHits() {
  agents.forEach(a => {
    const L = LOOK[a.id], [bx, top, bw] = BOX[a.id], rw = ROW[L.row];
    const minTop = L.row === 0 ? 0 : ROW[L.row - 1].road + 6;
    const t0 = Math.max(top, minTop), bottom = rw.road + 6.5;
    const b = document.createElement("button");
    b.className = "hit"; b.dataset.id = a.id;
    b.setAttribute("aria-label", `${a.name}: ${a.title}. ${a.status.text}`);
    Object.assign(b.style, {left: bx / W * 100 + "%", top: t0 / H * 100 + "%", width: bw / W * 100 + "%", height: (bottom - t0) / H * 100 + "%"});
    b.style.setProperty("--accent", L.accent); b.style.setProperty("--dot", toneVar(a.status.tone));
    const cx = (L.bx + L.bw / 2 - bx) / bw * 100;
    b.innerHTML = `<span class="tag" style="left:${cx}%;top:${(rw.road + .35 - t0) / (bottom - t0) * 100}%"><span class="n"><i></i>${esc(L.short)}</span><span class="r">${esc(L.tagRole)}</span></span>`;
    b.addEventListener("click", ev => {
      const r = townEl.getBoundingClientRect();
      const x = ev.clientX ? (ev.clientX - r.left) / r.width * W : L.bx + L.bw / 2, y = ev.clientY ? (ev.clientY - r.top) / r.height * H : rw.base - 10;
      openAgent(a.id, {x, y});
    });
    b.addEventListener("mouseenter", () => { if (!openId) setSel(a.id); });
    b.addEventListener("mouseleave", () => { if (!openId) setSel(null); });
    townEl.appendChild(b);
  });
}
function setSel(id) { sel = id; document.querySelectorAll(".hit").forEach(h => h.classList.toggle("sel", h.dataset.id === id)); }
function buildRoster() {
  const nav = document.getElementById("roster");
  nav.innerHTML = agents.map(a => `<button class="card" data-id="${a.id}" style="--accent:${LOOK[a.id].accent};--dot:${toneVar(a.status.tone)}">
    <span class="ic">${esc(a.name[0])}</span><span class="t"><span class="nm" style="display:block">${esc(a.name)}</span><span class="st"><i></i>${esc(a.status.text)}</span></span></button>`).join("");
  nav.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openAgent(c.dataset.id)));
}
function buildTicker() {
  const items = [];
  agents.forEach(a => (a.activity || []).slice(0, 2).forEach(x => items.push(`<b style="color:${LOOK[a.id].accent}">${esc(LOOK[a.id].short)}</b> ${esc(x.text)}`)));
  const html = items.join('<span class="sep">◆</span>') + '<span class="sep">◆</span>';
  document.getElementById("track").innerHTML = html + html;
}
function etParts() {
  const f = new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit", hour12: true});
  const parts = Object.fromEntries(f.formatToParts(new Date()).map(p => [p.type, p.value]));
  const h24 = Number(new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", hour: "numeric", hourCycle: "h23"}).format(new Date()));
  const day = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].indexOf(parts.weekday);
  return {label: `${parts.hour}:${parts.minute} ${parts.dayPeriod}`, weekday: parts.weekday, day, hour: h24};
}
function updateClock() {
  const e = etParts();
  document.getElementById("clock").innerHTML = `${e.label}<small>${e.weekday} · ET</small>`;
}

// ---------- panel ----------
let openId = null, sheetTw = null, sheetP = 0;
function heatmap(a) {
  const g = a.schedule.grid || [];
  if (!g.length) return `<div class="ondemand"><span class="pix" style="font-size:9px;color:var(--accent)">ON CALL</span>No fixed time slot: runs when asked</div>`;
  const e = etParts(), cells = {}, dayRows = new Set();
  g.forEach(([d, h, k]) => { if (h === null) dayRows.add(d); else cells[d + "-" + h] = k; });
  let html = '<div class="hm"><span></span>';
  for (let h = 0; h < 24; h++) html += `<span class="hl">${h % 6 === 0 ? ["12a", "", "", "", "", "", "6a", "", "", "", "", "", "12p", "", "", "", "", "", "6p"][h] : ""}</span>`;
  (DATA.days || []).forEach((dn, d) => {
    html += `<span class="dl ${d === e.day ? "today" : ""}">${dn}</span>`;
    for (let h = 0; h < 24; h++) {
      const k = cells[d + "-" + h] || (dayRows.has(d) ? "day" : "");
      html += `<span class="c ${k} ${d === e.day && h === e.hour ? "now" : ""}"></span>`;
    }
  });
  html += "</div>";
  const kinds = new Set(g.map(c => c[2]));
  const lg = [];
  if (kinds.has("run")) lg.push(`<span><b style="background:var(--accent)"></b>${a.id === "owl" ? "generate" : "scheduled run"}</span>`);
  if (kinds.has("alt")) lg.push(`<span><b style="background:#fff"></b>${a.id === "tars" ? "Friday data refresh" : "publish"}</span>`);
  if (kinds.has("day")) lg.push(`<span><b style="background:color-mix(in srgb,var(--accent) 30%,#161b28)"></b>runs that day (time not in repo)</span>`);
  lg.push(`<span><b style="outline:2px solid #fff;background:transparent"></b>now (ET)</span>`);
  return html + `<div class="legend">${lg.join("")}</div>`;
}
function panelHTML(a) {
  const L = LOOK[a.id];
  const pills = [`<span class="pill" style="--c:${toneVar(a.status.tone)}"><i></i>${esc(a.status.text)}</span>`]
    .concat((a.chips || []).map(c => `<span class="pill" style="--c:${toneVar(c.tone)}">${esc(c.text)}</span>`)).join("");
  const kpis = a.kpis.map(k => `<div class="kpi"><div class="v ${k.value === null || k.value === undefined ? "na" : ""}">${esc(fmt(k.value))}</div><div class="l">${esc(k.label)}</div><div class="s">${esc(k.note || "")}</div></div>`).join("");
  const feed = (a.activity || []).map(x => `<div class="row"><span class="w">${esc(x.when)}</span><span class="x">${esc(x.text)}${x.tag ? `<span class="tg ${x.tag === "PAPER" ? "p" : ""}">${esc(x.tag)}</span>` : ""}</span></div>`).join("");
  const titles = a.titles ? `<div class="sec">BOOKS ON THE SHELF</div><div class="titles">${a.titles.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : "";
  return `<div class="ph"><canvas id="picon" width="152" height="152"></canvas><div class="who"><h2 id="pname">${esc(a.name)}</h2><div class="ttl">${esc(a.title)}</div></div>
    <button class="close" id="pclose" aria-label="Close">✕</button></div>
    <div class="statusrow">${pills}</div>
    <p class="role">${esc(a.role)}</p>
    <div class="sec">BY THE NUMBERS</div><div class="kpis">${kpis}</div>
    <div class="sec">SCHEDULE</div><div class="sched"><div class="sum">${esc(a.schedule.summary)}</div>${heatmap(a)}</div>
    ${titles}
    <div class="sec">RECENT ACTIVITY</div><div class="feed">${feed || '<div class="row"><span class="w">—</span><span class="x">No activity in the repo yet</span></div>'}</div>
    <div class="src">Source <code>${esc(a.source)}</code><p>${esc(a.note || "")} Values shown as — are not in the repo.</p></div>`;
}
let iconAgent = null;
function drawIcon(t) {
  const c = document.getElementById("picon");
  if (!c || !iconAgent) return;
  const [bx, top, bw] = BOX[iconAgent], rw = ROW[LOOK[iconAgent].row];
  const span = Math.max(bw, rw.base - top) + 2, u = c.width / span;
  const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
  const ox = bx + bw / 2 - span / 2, oy = rw.base + 1.5 - span;
  const P = painter(g, u, ox, oy);
  P.r(ox, rw.base, span, 2, "#1a2a20");
  B[iconAgent](P, t);
}
function setSheet(p) {
  sheetP = p;
  panel.style.transform = `translate(-50%, ${(1 - p) * 105}%)`;
  scrim.style.opacity = p;
}
function openAgent(id, at) {
  const a = byId[id]; if (!a) return;
  const L = LOOK[id];
  ripple = {x: at ? at.x : L.bx + L.bw / 2, y: at ? at.y : ROW[L.row].base - 12, t0: now()};
  setSel(id);
  openId = id; iconAgent = id;
  panel.style.setProperty("--accent", L.accent);
  ps.innerHTML = panelHTML(a); ps.scrollTop = 0;
  document.getElementById("pclose").addEventListener("click", closeAgent);
  sheet.classList.add("on"); sheet.setAttribute("aria-hidden", "false");
  const from = sheetP;
  if (sheetTw) tweens.splice(tweens.indexOf(sheetTw) >>> 0, 1);
  sheetTw = tween(520, p => setSheet(from + (1 - from) * p), easeOut);
  setTimeout(() => { if (VT === null) document.getElementById("pclose")?.focus({preventScroll: true}); }, 50);
}
function closeAgent() {
  if (!openId) return;
  openId = null; iconAgent = null;
  const from = sheetP;
  if (sheetTw) tweens.splice(tweens.indexOf(sheetTw) >>> 0, 1);
  sheetTw = tween(420, p => { setSheet(from * (1 - p)); if (p >= 1) { sheet.classList.remove("on"); sheet.setAttribute("aria-hidden", "true"); setSel(null); } }, easeInOut);
}
function scrollPanel(frac, dur = 2200) {
  const from = ps.scrollTop, to = (ps.scrollHeight - ps.clientHeight) * frac;
  tween(dur, p => { ps.scrollTop = from + (to - from) * p; });
}
scrim.addEventListener("click", closeAgent);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAgent(); });

// ---------- loop ----------
const track = document.getElementById("track");
function frame() {
  const t = now();
  runTweens();
  render(t);
  if (iconAgent) drawIcon(t);
  const half = track.scrollWidth / 2;
  if (half > 0) track.style.transform = `translateX(${-((t * .045) % half)}px)`;
}
function loop() { if (VT === null) { frame(); requestAnimationFrame(loop); } }

function drawMark() {
  const c = document.getElementById("mark"), g = c.getContext("2d");
  const px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  px(2, 7, 5, 9, "#3ddc97"); px(8, 3, 7, 13, "#b48cff"); px(3, 9, 1, 1, "#0b0e22"); px(5, 9, 1, 1, "#0b0e22"); px(3, 12, 1, 1, "#0b0e22");
  px(10, 5, 1, 1, "#ffd166"); px(12, 5, 1, 1, "#ffd166"); px(10, 8, 1, 1, "#0b0e22"); px(12, 8, 1, 1, "#ffd166"); px(10, 11, 1, 1, "#ffd166"); px(11, 13, 2, 3, "#0b0e22");
  px(0, 16, 17, 1, "#3a4050");
}

// recording hooks: switch to a virtual clock and step frames exactly
window.__town = {
  virtual(t0 = 0) { VT = t0; frame(); },
  advance(ms) { VT += ms; frame(); },
  open: id => { const L = LOOK[id]; openAgent(id, {x: L.bx + L.bw / 2, y: ROW[L.row].base - 12}); },
  close: closeAgent, scroll: scrollPanel, ids: () => agents.map(a => a.id),
};

function init() {
  drawMark();
  buildHits(); buildRoster(); buildTicker(); updateClock();
  setInterval(updateClock, 15000);
  document.getElementById("sub").textContent = `${agents.length} agents on shift · tap a building`;
  document.getElementById("foot").textContent = `Counts from the agents' repos · ${DATA.generated || "—"} · — = not in repo`;
  new ResizeObserver(resize).observe(townEl);
  resize(); loop();
}
const fontsReady = document.fonts ? Promise.all(['16px VT323', '12px "Press Start 2P"', '15px Inter'].map(f => document.fonts.load(f))).catch(() => null) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(init);
</script>
